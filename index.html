<title>Little Lab</title> 
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: chunky "lab toy" UI on graph paper — sticker buttons with ink outlines and press-down shadows; one subject colour per science. Deliberate single light theme for kids. */
:root{
  --paper:#F2F6F1; --grid:#DFE9E2; --card:#FFFFFF; --ink:#1D2A44; --muted:#5B6782;
  --sun:#FFC83D; --math:#7B5CD6; --math-soft:#ECE6FB; --phys:#2F86D6; --phys-soft:#E1EEFA;
  --chem:#14957F; --chem-soft:#DDF3EE; --space:#3F3A9E; --space-soft:#E6E4F8; --eng:#C8492E; --eng-soft:#FCE5DC; --good:#1E9E54; --bad:#D9483B;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;padding-inline:16px;padding-block:0 32px;min-height:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--phys);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding-block:12px;background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.5px;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:26px;height:26px;border:3px solid var(--ink);border-radius:0 0 12px 12px;background:linear-gradient(transparent 45%,var(--chem) 45%);position:relative;top:2px}
.pill{border:3px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--card);font-weight:700;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.stars{background:var(--sun)}
.stars.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25) rotate(-6deg)}}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}

.btn{border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--ink);padding:14px 20px;font-weight:700;font-size:20px;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* picker */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-top:28px}
.who{text-align:left;padding:24px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.who .name{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.who .tag{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.who .list{color:var(--muted)}
.who.fs2{background:#FFF4D6}.who.y5{background:var(--phys-soft)}

/* hub */
.hub{display:grid;grid-template-columns:1fr;gap:20px;margin-top:24px}
@media (min-width:600px){.hub{grid-template-columns:1fr 1fr}}
@media (min-width:1060px){.hub{grid-template-columns:repeat(4,1fr)}}
.subj{border:3px solid var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.subj h2{font-size:30px;display:flex;align-items:center;gap:10px}
.subj h2 span{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
.subj.math{background:var(--math-soft)}.subj.math h2 span{background:var(--math)}
.subj.phys{background:var(--phys-soft)}.subj.phys h2 span{background:var(--phys)}
.subj.chem{background:var(--chem-soft)}.subj.chem h2 span{background:var(--chem)}
.subj.space{background:var(--space-soft)}.subj.space h2 span{background:var(--space)}
.subj.eng{background:var(--eng-soft);grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}.subj.eng h2{grid-column:1/-1}.subj.eng h2 span{background:var(--eng)}
.eng .eyebrow{color:var(--eng)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:14px}
.prose{min-width:0}.prose p,.prose li{max-width:68ch}.prose h2{font-size:30px;margin-bottom:8px}.prose h3{font-size:24px;margin:20px 0 8px}
mark{background:#FFE08A;color:var(--ink);padding:0 3px;border-radius:4px}
.exs{display:grid;grid-template-columns:1fr;gap:10px;margin:14px 0}@media (min-width:640px){.exs{grid-template-columns:1fr 1.6fr}}
.ex{border:2px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--paper);font-size:19px}.ex small{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.tablewrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:18px}td,th{border-bottom:2px solid var(--grid);padding:10px 12px;text-align:left;vertical-align:top}
.tip{border:2px dashed var(--eng);border-radius:14px;padding:12px 16px;background:var(--eng-soft);margin-top:14px}
.gaps{font-size:26px;line-height:2.2;font-family:var(--display);font-weight:600}
.gaps .w{white-space:nowrap}.gap{border:2px dashed var(--muted);background:var(--card);border-radius:10px;min-width:36px;height:40px;margin:0 3px;font:800 22px var(--display);color:var(--muted);vertical-align:middle}
.gap.ok{border:3px solid var(--good);color:var(--good);background:#E3F6EA}.gap.no{border-color:var(--bad);color:var(--bad)}
.wbtn{border:2px solid transparent;background:none;border-radius:10px;padding:2px 6px;font:inherit}.wbtn:active,.wbtn:hover{border-color:var(--muted)}
.wbtn.ok{background:var(--good);color:#fff}.wbtn.no{border-color:var(--bad);color:var(--bad)}
.bank{display:flex;flex-direction:column;gap:10px;border:2px solid var(--ink);border-radius:16px;padding:14px;background:var(--paper);margin-bottom:16px}.bk{font-weight:700;color:var(--muted)}
.bank .chip{font-size:16px;padding:6px 12px}
.writes{display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
textarea{width:100%;font:inherit;font-size:20px;border:3px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--card);color:var(--ink);resize:vertical}
.wrow .lbl{text-transform:none;letter-spacing:0;font-size:17px;color:var(--ink)}
.scene{display:flex;gap:16px;align-items:center;border:2px solid var(--ink);border-radius:16px;padding:14px;background:var(--paper)}.scene>span{font-size:54px;line-height:1}
.links{display:flex;flex-direction:column;gap:8px;margin-top:18px;padding-top:14px;border-top:2px dashed var(--grid)}
.links a{color:var(--phys);font-weight:700;text-underline-offset:3px}
.week{border:3px solid var(--ink);border-radius:22px;background:var(--sun);padding:16px 18px;margin:16px 0 4px;display:grid;gap:12px}
.week h2{font-size:30px}.wk-btns{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.fig.wide{max-width:460px;margin:0 auto 10px}
.bigpic{font-size:96px;text-align:center;line-height:1.1;margin-bottom:10px}
.kopts .btn.letter span{font:800 72px var(--display)}
.actbtn{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.actbtn b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.actbtn small{color:var(--muted);font-size:15px;font-weight:400}

/* activity shell */
.act{margin-top:10px;display:flex;flex-direction:column;gap:18px}
.act-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
.math .eyebrow{color:var(--math)}.space .eyebrow{color:var(--space)}.phys .eyebrow{color:var(--phys)}.chem .eyebrow{color:var(--chem)}
.panel{border:3px solid var(--ink);border-radius:22px;background:var(--card);padding:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);border-radius:999px;padding:8px 16px;background:var(--card);font-weight:700;box-shadow:0 3px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--sun)}
.fb{min-height:1.5em;font-weight:700;font-size:20px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}

/* sprint */
.split{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:760px){.split{grid-template-columns:1.2fr 1fr}}
.q{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.1;margin:12px 0}
.q.small{font-size:clamp(24px,3.6vw,34px)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 4px;font-size:.8em}
.frac b{border-bottom:4px solid var(--ink);padding:0 6px 2px}
.frac em{font-style:normal;padding-top:2px}
.ansbox{border:3px dashed var(--ink);border-radius:16px;padding:10px 18px;font-family:var(--display);font-size:44px;font-weight:800;min-height:80px;font-variant-numeric:tabular-nums;background:var(--paper)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad .btn{font-size:30px;padding:14px 0;font-family:var(--display)}
.pad .span2{grid-column:span 2}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.help{border:2px dashed var(--ink);border-radius:16px;padding:12px 16px;background:var(--card);font-size:16px;line-height:1.6}
.qpre{font-weight:700;color:var(--muted);font-size:18px;margin-top:10px}
.fig{max-width:340px}.fig svg{width:100%;height:auto;display:block}
.fig .tri{fill:var(--math-soft);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.fig .ra,.fig .arc{fill:none;stroke:var(--ink);stroke-width:2.5}
.fig text{font:700 19px var(--body);fill:var(--ink)}.fig text.unk{fill:var(--math);font-size:24px}.fig .nts{font-size:12px;font-weight:400;fill:var(--muted)}
.things.sm{gap:6px;align-items:center}
.thing.sm{width:44px;height:44px;font-size:36px;display:inline-grid;place-items:center}
.thing.gone{opacity:.25;position:relative}.thing.gone::after{content:"";position:absolute;left:4px;right:4px;top:50%;height:4px;background:var(--bad);transform:rotate(-35deg);border-radius:2px}
.plus{font:800 44px var(--display);padding:0 8px}
.tenframe{display:grid;grid-template-columns:repeat(5,56px);gap:6px;justify-content:center;padding:10px}
.tenframe i{height:56px;border:3px solid var(--ink);border-radius:10px;background:var(--card)}.tenframe i.on{background:var(--math)}
.kopts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kopts .btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:20px;padding:16px 8px}.kopts .btn span{font-size:60px;line-height:1}

/* mc */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.opts .btn{text-align:left;font-size:20px}

/* canvas sims */
.stage{position:relative;width:100%;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff}
canvas{display:block;width:100%}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;align-items:end}
.lbl{font-size:14px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
input[type=range]{width:100%;height:44px;accent-color:var(--ink)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ro{border:2px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper)}
.ro small{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.ro b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.tasks{display:flex;flex-wrap:wrap;gap:10px}
.task{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;background:var(--card)}
.task.done{background:var(--good);color:#fff}

/* sorter */
.card-big{border:3px solid var(--ink);border-radius:22px;background:var(--card);padding:28px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.card-big .q{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .btn{font-size:22px;padding:20px 10px}

/* FS2 */
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.speak{width:64px;height:64px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
.speak svg{width:30px;height:30px}
.things{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px}
.thing{width:84px;height:84px;font-size:56px;line-height:1;border:none;background:none;position:relative;padding:0}
.thing .n{position:absolute;right:-4px;top:-4px;background:var(--sun);border:3px solid var(--ink);border-radius:50%;width:34px;height:34px;font:800 18px/28px var(--display)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.nums .btn{font-family:var(--display);font-size:56px;padding:10px 0}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.shapes .btn{padding:14px;aspect-ratio:1;max-width:100%}
.shapes svg{width:100%;height:100%}
.tank{position:relative;height:300px;border:4px solid var(--ink);border-top:none;border-radius:0 0 28px 28px;background:linear-gradient(transparent 38%,#9BD3F2 38%,#5AB0E3 100%);overflow:hidden;max-width:520px;margin:0 auto;width:100%}
.tank::before{content:"";position:absolute;left:0;right:0;top:38%;height:6px;background:repeating-linear-gradient(90deg,#fff8 0 18px,transparent 18px 36px)}
.obj{position:absolute;left:50%;top:6px;font-size:64px;line-height:1;transform:translateX(-50%);transition:top 1.3s cubic-bezier(.45,.05,.55,.95)}
.obj.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(6px) rotate(4deg)}}
.pots{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pot{width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:0}
.pot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bowl{width:min(220px,60vw);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);margin:0 auto;background:#fff;transition:background .8s;display:grid;place-items:center;position:relative}
.bowl.swirl{animation:spin .9s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
.blobs{display:flex;gap:10px;justify-content:center;min-height:40px}
.blobs i{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink)}
.done-card{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:24px}
.big-star{font-size:80px;line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <button class="pill" id="back" hidden>‹ Back</button>
    <div class="brand"><i aria-hidden="true"></i>Little Lab</div>
    <div class="pill stars" id="stars" aria-label="Stars earned">★ <span id="starN">0</span></div>
    <button class="pill" id="who" hidden>Switch</button>
  </header>
  <main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s), main=$('#main');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S={profile:null,stars:{fs2:0,y5:0}};
const NAMES={fs2:'FS2',y5:'Year 5'};
try{const d=JSON.parse(localStorage.getItem('littlelab')||'{}');Object.assign(S.stars,d.stars||{});}catch(e){}
function save(){try{localStorage.setItem('littlelab',JSON.stringify({stars:S.stars}))}catch(e){}}
function updStars(pop){$('#starN').textContent=S.profile?S.stars[S.profile]:0;if(pop){const s=$('#stars');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}}
function star(){if(!S.profile)return;S.stars[S.profile]++;save();updStars(true)}
let AC;function tone(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[660,880,1175]:[260,200]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.1);g.gain.exponentialRampToValueAtTime(.18,t+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.1+.25);o.connect(g).connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+.3)})}catch(e){}}
function say(txt){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.88;u.pitch=1.15;s.speak(u)}catch(e){}}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

/* ---------- navigation ---------- */
let stack=[],cleanup=null;
function go(fn,push=true){if(cleanup){cleanup();cleanup=null}try{speechSynthesis.cancel()}catch(e){}
  if(push)stack.push(fn);main.innerHTML='';fn();window.scrollTo(0,0);
  $('#back').hidden=stack.length<=1;$('#who').hidden=!S.profile;
  if(S.profile)$('#who').textContent=NAMES[S.profile]+' ⇄';updStars()}
$('#back').onclick=()=>{if(stack.length>1){stack.pop();go(stack[stack.length-1],false)}};
$('#who').onclick=()=>{stack=[];S.profile=null;go(home)};

const SUBJ={eng:'English',math:'Maths',phys:'Physics',chem:'Chemistry',space:'Space'};
const ACTS={
 y5:{eng:[['Writing Workshop','8 writing features: fronted adverbials, noun phrases, speech, figurative language, clauses, parenthesis, show don’t tell',()=>writingHub()]],
     math:[['Number Sprint','Fractions, decimals, %, BIDMAS, negatives, area',()=>sprint()],['Algebra Lab','Solve for x, substitute, nth term, two unknowns',()=>algebra()],['Triangles & Trig','Angle sums, Pythagoras, sin, cos and tan',()=>trig()]],
     phys:[['Friction Track','Push a cart across ice, wood, carpet and sand. Park it in the zone.',()=>track()],['Forces Quiz','Gravity, air resistance, levers, pulleys and gears',()=>forcesQuiz()],['Newton’s Laws','The three laws of motion: inertia, F = ma, action and reaction',()=>newtonQuiz()],['Newton Maths','Solve problems with F = ma, weight and resultant forces',()=>newtonMaths()],['Flight School','Read, then answer: forces of flight, lift, drag, wind tunnels, steering',()=>flightSchool()]],
     chem:[['Particle Lab','Heat and cool water. Watch the particles change state.',()=>particles()],['Change Sorter','Reversible or irreversible? Sort 12 real changes.',()=>sorter()]],
     space:[['Space Quiz','Orbits, planets, day and night, seasons',()=>spaceQuiz()]]},
 fs2:{eng:[['First Sounds','Hear a word, pick the letter it starts with',()=>firstSounds()],['Rhyme Time','Find the word that rhymes',()=>rhymeTime()]],
     math:[['Add & Take Away','Adding, taking away and number bonds to 10',()=>addGame()],['Count With Me','Count up to 20, then pick the number',()=>countGame()],['Shape Spotter','Listen and find the right shape',()=>shapeGame()]],
     phys:[['Sink or Float','Guess, then drop it in the water',()=>sinkFloat()]],
     chem:[['Colour Mixer','Mix two paints to make a new colour',()=>mixer()]],
     space:[['Space Explorers','Sun, Moon, planets and rockets',()=>spaceKids()]]}
};

function home(){
  main.innerHTML=`<section style="margin-top:14px"><h1>Pick your level</h1>
  <p class="lead">English, maths, physics, chemistry and space to play with. Earn a star for every right answer.</p>
  <div class="pick">
   <button class="btn who fs2" data-p="fs2"><span class="tag">Little Explorers</span><span class="name">FS2</span><span class="list">Phonics · Adding · Counting · Shapes · Sink or float · Colours · Space</span><span class="list">★ ${S.stars.fs2} stars</span></button>
   <button class="btn who y5" data-p="y5"><span class="tag">Lab Scientists</span><span class="name">Year 5</span><span class="list">Writing · Algebra · Trigonometry · Newton’s laws · Particles · Space</span><span class="list">★ ${S.stars.y5} stars</span></button>
  </div></section>`;
  main.querySelectorAll('.who').forEach(b=>b.onclick=()=>{S.profile=b.dataset.p;go(hub)});
}
function hub(){
  const p=S.profile,a=ACTS[p];
  main.innerHTML=`<section style="margin-top:14px"><h1>${NAMES[p]} Lab. Pick an activity.</h1>

const fr=(n,d)=>`<span class="frac"><b>${n}</b><em>${d}</em></span>`;
const fmt=v=>String(v).replace('-','−');
function numQuiz({cls,sub,title,lead,topics,help}){
  const keys=Object.keys(topics),others=keys.filter(k=>topics[k][1]);let topic=keys[0],i,score,res,q,inp,lock;const N=10;
  main.innerHTML=`<section class="act ${cls}">${head(cls,sub,title)}${lead?`<p class="lead" style="margin:0">${lead}</p>`:''}
   <div class="chips" id="tp">${keys.map(k=>`<button class="chip" data-t="${k}">${topics[k][0]}</button>`).join('')}</div>
   <div class="split"><div class="panel" id="qp"></div><div class="side"><div class="pad" id="pad">${'789456123'.split('').map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('')}<button class="btn" data-k="neg" aria-label="Minus sign">−</button><button class="btn" data-k="0">0</button><button class="btn" data-k=".">.</button><button class="btn" data-k="del" aria-label="Delete">⌫</button><button class="btn primary span2" data-k="ok">Check</button></div>${help?`<div class="help">${help}</div>`:''}</div></div></section>`;
  const qp=$('#qp'),show=()=>{$('#ans').innerHTML=inp?fmt(inp):'&nbsp;'};
  function start(){i=0;score=0;res=[];next()}
  function next(){if(i>=N){qp.innerHTML=doneCard(score,N);$('#again').onclick=start;return}
    const g=topics[topic][1]||topics[others[R(0,others.length-1)]][1];q=g();inp='';lock=false;
    qp.innerHTML=`<div class="dots">${Array.from({length:N},(_,k)=>`<i class="${res[k]===1?'ok':res[k]===0?'no':k===i?'now':''}"></i>`).join('')}</div>
     ${q.fig?`<div class="fig">${q.fig}</div>`:''}${q.p?`<div class="qpre">${q.p}</div>`:''}<div class="q ${q.s?'small':''}">${q.t}</div><div class="ansbox" id="ans">&nbsp;</div><div class="fb" id="fb"></div>`}
  function check(){if(lock||inp===''||inp==='-')return;lock=true;const ok=Math.abs(parseFloat(inp)-q.a)<1e-6,fb=$('#fb');
    res[i]=ok?1:0;if(ok){score++;star();fb.className='fb ok';fb.textContent='Correct!'}else{fb.className='fb no';fb.textContent=`Not quite. The answer is ${fmt(q.a)}.${q.why?' '+q.why:''}`}
    tone(ok);setTimeout(()=>{i++;next()},ok?900:2800)}
  function key(k){if(lock||i>=N)return;if(k==='ok')return check();if(k==='del')inp=inp.slice(0,-1);else if(k==='neg')inp=inp.startsWith('-')?inp.slice(1):'-'+inp;else if(inp.length<7&&!(k==='.'&&inp.includes('.')))inp+=k;show()}
  $('#pad').onclick=e=>{const b=e.target.closest('button');if(b)key(b.dataset.k)};
  const tp=$('#tp');function setT(t){topic=t;tp.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t===t));start()}
  tp.onclick=e=>{const c=e.target.closest('.chip');if(c)setT(c.dataset.t)};
  const kb=e=>{if(/^[0-9.]$/.test(e.key))key(e.key);else if(e.key==='-')key('neg');else if(e.key==='Backspace')key('del');else if(e.key==='Enter')key('ok')};
  document.addEventListener('keydown',kb);cleanup=()=>document.removeEventListener('keydown',kb);
  setT(keys[0]);
}

 negatives:()=>{const a=R(1,10),b=R(a+1,a+15);return Math.random()<.5?{t:`${a} − ${b} =`,a:a-b}:{t:`−${b} + ${a} =`,a:a-b}},

  {o:['a battered suitcase with a broken handle','he carried a suitcase','with a broken handle'],why:'“Suitcase” is the noun at the centre.'},
  {o:['three noisy seagulls on the harbour wall','seagulls squawked','on the harbour wall'],why:'“Seagulls” is the noun, with detail added both sides.'},
  {o:['an enormous chocolate cake with pink icing','she baked a cake','pink icing'],why:'Adjectives before and detail after the noun “cake”.'}]},
 a2:{name:'Before or after?',p:'What has been added to the noun?',opts:['Adjectives before','Detail after','Both'],items:[
  {q:'a cold, frosty morning',c:0,why:'Only adjectives before “morning”.'},
  {q:'the boy with the red hat',c:1,why:'The detail comes after “boy”.'},
  {q:'the grumpy old man in the corner shop',c:2,why:'Adjectives before and detail after “man”.'},
  {q:'a castle on the hill',c:1,why:'“On the hill” comes after the noun.'},
  {q:'two fluffy white kittens',c:0,why:'Only adjectives before “kittens”.'}]},
 a3:{name:'Find the noun',mode:'word',p:'Tap the main noun the phrase is built around.',items:[['The tall, creaky gate at the bottom of the garden swung open.','gate'],['A tiny brown mouse with a long tail scurried past.','mouse'],['We visited an enormous museum full of dinosaur bones.','museum'],['Her shiny silver bike leaned against the wall.','bike']]},
 a4:{name:'Upgrade it',p:'Expand the noun in each sentence. Add adjectives before it and detail after it.',
  bank:{Adjectives:['ancient','scaly','fierce','enormous','gnarled','nervous'],'Detail after':['with glowing eyes','in a muddy coat','covered in moss','by the river']},
  items:[{base:'The dragon flew over the village.',key:'dragon',ex:'The fierce, scaly dragon with glowing eyes flew over the sleeping village.'},{base:'A boy opened the door.',key:'boy',ex:'A nervous boy in a muddy coat opened the creaking door.'},{base:'The tree fell.',key:'tree',ex:'The ancient, gnarled tree covered in moss fell.'}],
  chk:(v,b,it)=>!nrm(v).split(' ').includes(it.key)?`Keep the noun “${it.key}” in your sentence.`:wc(v)<wc(b)+3?'Add more detail around the noun (before and after).':''},
 ch:{emoji:'🏰🌫️',scene:'An abandoned castle on a misty hill.',task:'Write three sentences describing the castle. Each one needs an expanded noun phrase with detail before <b>and</b> after the noun.',hints:['describe the castle','describe something inside','describe a creature that lives there'],
  chk:v=>wc(v)<8?'Write a longer sentence (at least 8 words).':'',
  ex:['The crumbling grey castle on the misty hill had stood empty for years.','Inside, a dusty wooden throne with a cracked red cushion sat alone.','A small, silent bat with leathery wings hung from the broken beams.']},
 look:['Adjectives chosen carefully (not too many)','Detail added after the noun with a preposition','Commas between two adjectives of the same kind']},

{id:'speech',name:'Punctuating Speech',blurb:'Inverted commas, commas and capitals',
 learn:{what:'When characters speak, put their exact words inside <b>inverted commas</b> (“speech marks”). The spoken words start with a <b>capital letter</b>, and the punctuation at the end of the speech goes <b>inside</b> the closing inverted comma.',
  ex:[['Mum said hurry up','<mark>“Hurry up,”</mark> said Mum.','speech first'],['Raj shouted look out','<mark>“Look out!”</mark> shouted Raj.','with !'],['Dad asked where are my keys','Dad asked, <mark>“Where are my keys?”</mark>','reporting clause first']],
  why:'Speech brings characters to life and lets the reader hear how they feel.',
  tableTitle:'Speech rules',table:[['Speech first','“I’m hungry<mark>,</mark>” said Leo.'],['Reporter first','Leo said<mark>,</mark> “I’m hungry.”'],['Question or shout','“Are we there yet<mark>?</mark>” asked Leo.'],['New speaker','Start a new line']],
  tip:'Swap “said” for a more powerful verb: whispered, yelled, muttered, giggled, groaned, replied.'},
 a1:{name:'Spot it',p:'Which sentence is punctuated correctly?',items:[
  {o:['“Can we go to the park?” asked Lily.','“Can we go to the park”? asked Lily.','Can we go to the park? “asked Lily.”'],why:'The question mark goes inside the closing inverted comma.'},
  {o:['“I love pizza,” said Omar.','“I love pizza” said Omar.','“I love pizza.” said Omar.'],why:'Use a comma (not a full stop) when the sentence carries on.'},
  {o:['The coach shouted, “Run faster!”','The coach shouted “run faster!”','The coach shouted, “Run faster”!'],why:'Comma before the speech, capital letter, ! inside.'},
  {o:['“Watch out!” screamed Zara.','“Watch out”! screamed Zara.','“watch out!” screamed Zara.'],why:'Capital letter at the start of the speech, ! inside.'}]},
 a2:{name:'Fill the gap',p:'Which punctuation mark goes in the gap?',opts:[',','?','!','.'],items:[
  {q:'“I love this song<mark>_</mark>” said Amir.',c:0,why:'A statement followed by “said” needs a comma.'},
  {q:'“Where are my shoes<mark>_</mark>” asked Dad.',c:1,why:'It is a question.'},
  {q:'“Help<mark>_</mark>” screamed the sailor.',c:2,why:'It is shouted, so use !'},
  {q:'The teacher said, “Line up quietly<mark>_</mark>”',c:3,why:'The sentence ends, so use a full stop inside.'},
  {q:'“Shh<mark>_</mark>” whispered Gran, “the baby is asleep.”',c:0,why:'The sentence continues, so use a comma.'}]},
 a3:{name:'Spoken words',mode:'word',p:'Tap the first word that is actually spoken.',items:[['Mr Patel smiled and said, “Well done, everyone.”','well'],['“I can’t find it,” groaned Leo.','i'],['Grandma whispered, “Close your eyes.”','close'],['After a pause, Maya replied, “Yes, please.”','yes']]},
 a4:{name:'Fix it',p:'Rewrite each sentence with inverted commas and the right punctuation.',
  bank:{'Instead of said':['whispered','yelled','muttered','giggled','groaned','replied']},
  items:[{base:'stop shouted the guard',ex:'“Stop!” shouted the guard.'},{base:'what time is it asked Sam',ex:'“What time is it?” asked Sam.'},{base:'the teacher said please sit down',ex:'The teacher said, “Please sit down.”'}],
  noKeep:1,chk:v=>!quotes(v)?'Put inverted commas around the spoken words.':!speechPunct(v)?'Put a , ! ? or . just before the closing inverted comma.':!/["“][A-Z]/.test(v)?'Start the spoken words with a capital letter.':''},
 ch:{emoji:'👽🌳',scene:'Two friends find a tiny alien in the garden.',task:'Write three lines of conversation. Use a <b>different</b> verb instead of “said” each time.',hints:['the first friend spots the alien','the alien replies','the second friend reacts'],
  chk:v=>!quotes(v)?'Put inverted commas around the spoken words.':!speechPunct(v)?'Put punctuation just before the closing inverted comma.':'',
  ex:['“What is that?” gasped Noor, pointing at the flowerbed.','“Greetings, Earthlings,” squeaked the alien politely.','“It can talk!” yelled Ollie, dropping his football.']},
 look:['Inverted commas around the exact spoken words','Capital letter at the start of speech','Punctuation inside the closing inverted comma','New line for each new speaker']},

{id:'figurative',name:'Figurative Language',blurb:'Similes, metaphors and personification',
 learn:{what:'<b>Figurative language</b> describes something by comparing it to something else, or by giving it human qualities. It helps the reader imagine things in a fresh way.',
  ex:[['The moon was bright.','The moon was <mark>as bright as a torch</mark>.','simile'],['The moon was bright.','The moon was <mark>a silver coin</mark> in the sky.','metaphor'],['The moon was bright.','The moon <mark>peeped</mark> through the clouds.','personification']],
  why:'It turns plain description into a picture the reader remembers.',
  tableTitle:'Types',table:[['Simile','Uses “like” or “as”: <mark>as cold as ice</mark>'],['Metaphor','Says it <i>is</i> something: <mark>the snow was a blanket</mark>'],['Personification','Gives a thing human actions: <mark>the wind howled</mark>'],['Alliteration','Same starting sound: <mark>slippery slimy snails</mark>'],['Onomatopoeia','Sound words: <mark>crash, sizzle, buzz</mark>']],
  tip:'Avoid tired comparisons like “as white as snow”. Invent your own!'},
 a1:{name:'Spot it',p:'Pick the sentence that uses the figurative language named.',items:[
  {q:'Which one is a <b>simile</b>?',o:['The baby slept like a log.','The baby slept for hours.','The baby was a sleepy log.'],why:'It uses “like” to compare.'},
  {q:'Which one is a <b>metaphor</b>?',o:['The classroom was a zoo.','The classroom was like a zoo.','The classroom was noisy.'],why:'It says the classroom IS a zoo.'},
  {q:'Which one is <b>personification</b>?',o:['The kettle screamed on the stove.','The kettle was very hot.','The kettle was as loud as a siren.'],why:'Kettles can’t really scream.'},
  {q:'Which one uses <b>alliteration</b>?',o:['Big brown bears bounced on the bed.','The bears jumped up and down.','The bears were like trampolines.'],why:'Lots of words start with b.'}]},
 a2:{name:'Name it',p:'Which type of figurative language is this?',opts:['Simile','Metaphor','Personification','Alliteration','Onomatopoeia'],items:[
  {q:'The wind howled angrily at the door.',c:2,why:'The wind is given a human action.'},
  {q:'Her eyes were sparkling diamonds.',c:1,why:'It says her eyes ARE diamonds.'},
  {q:'He ran as fast as a cheetah.',c:0,why:'It uses “as … as”.'},
  {q:'Seven slippery snakes slid slowly.',c:3,why:'Repeated “s” sounds.'},
  {q:'Crash! The plates smashed on the floor.',c:4,why:'“Crash” sounds like the noise it makes.'}]},
 a3:{name:'Human actions',mode:'word',p:'Tap the word that gives the thing a human action.',items:[['The old car groaned up the hill.','groaned'],['Leaves danced across the playground.','danced'],['The sun smiled down on the beach.','smiled'],['Thunder grumbled in the distance.','grumbled']]},
 a4:{name:'Upgrade it',p:'Rewrite each sentence using the type of figurative language shown.',
  bank:{'Simile starters':['as … as a …','like a …'],'Human verbs':['whispered','danced','crept','sighed','raced','grumbled']},
  items:[{base:'The sea was rough.',label:'simile',ex:'The sea was as wild as a bucking horse.',need:v=>/\blike\b|\bas\b.*\bas\b/.test(lc(v))?'':'A simile needs “like” or “as … as”.'},{base:'The classroom was noisy.',label:'metaphor',ex:'The classroom was a buzzing beehive.',need:v=>/\blike\b/.test(lc(v))?'A metaphor doesn’t use “like”. Say it IS something.':''},{base:'The wind blew.',label:'personification',ex:'The wind whispered secrets through the trees.',need:v=>/\bblew\b/.test(lc(v))?'Swap “blew” for a human action.':''}],
  noKeep:1,chk:(v,b,it)=>wc(v)<5?'Write a longer sentence.':it.need(v)},
 ch:{emoji:'🌋',scene:'A volcano erupting.',task:'Write a simile, a metaphor and a personification about the volcano.',hints:['a simile','a metaphor','personification'],
  chk:(v,j)=>wc(v)<6?'Write a longer sentence (at least 6 words).':j===0&&!/\blike\b|\bas\b.*\bas\b/.test(lc(v))?'A simile needs “like” or “as … as”.':j===1&&/\blike\b/.test(lc(v))?'A metaphor doesn’t use “like”.':'',
  ex:['Lava poured down the mountain like boiling orange syrup.','The volcano was a furious dragon breathing fire.','The ground trembled and the mountain roared in anger.']},
 look:['The right type used each time','Fresh, original comparisons','Description that helps the reader picture the scene']},

{id:'subordinate',name:'Subordinate Clauses',blurb:'because, although, when, if…',
 learn:{what:'A <b>main clause</b> makes sense on its own. A <b>subordinate clause</b> adds extra information but <b>does not</b> make sense on its own. It starts with a subordinating conjunction such as <b>because, when, although, if, while, until, since, after, before</b>.',
  ex:[['We stayed inside.','We stayed inside <mark>because it was pouring with rain</mark>.','after'],['Maya sang beautifully.','<mark>Although she was nervous,</mark> Maya sang beautifully.','at the start'],['I’ll help you.','I’ll help you <mark>when I’ve finished my lunch</mark>.','after']],
  why:'Subordinate clauses explain why, when or how things happen, making sentences richer.',
  tableTitle:'Conjunctions (A WHITE BUS)',table:[['A','after, although, as'],['W','when, while'],['H','how'],['I','if'],['T','though'],['E','even though'],['B','because, before'],['U','until, unless'],['S','since']],
  tip:'If the subordinate clause comes first, put a comma after it.'},
 a1:{name:'Spot it',p:'Which of these is a subordinate clause?',items:[
  {o:['because the bus was late','The bus was late.','the late bus'],why:'It starts with “because” and doesn’t make sense alone.'},
  {o:['while the baby slept','The baby slept.','a sleeping baby'],why:'“While…” needs a main clause to make sense.'},
  {o:['if you finish your homework','You finished your homework.','finished homework'],why:'“If…” leaves the reader waiting for more.'},
  {o:['although it was freezing','It was freezing.','a freezing day'],why:'“Although…” can’t stand alone.'}]},
 a2:{name:'Pick the conjunction',p:'Which conjunction fits best?',items:[
  {q:'We put up our umbrellas ___ it started to rain.',o:['because','although','unless'],c:0,why:'It explains why.'},
  {q:'___ he was exhausted, Ollie kept running.',o:['Although','Because','If'],c:0,why:'It shows a contrast.'},
  {q:'You can play outside ___ you tidy your room.',o:['after','although','because'],c:0,why:'It shows the order of events.'},
  {q:'We waited ___ the rain stopped.',o:['until','because','if'],c:0,why:'It tells us how long.'},
  {q:'___ you need help, just ask.',o:['If','Although','Until'],c:0,why:'It is a condition.'}]},
 a3:{name:'Find the conjunction',mode:'word',p:'Tap the subordinating conjunction.',items:[['We waited until the film started.','until'],['If you finish early, you can read.','if'],['Tom hummed while he painted.','while'],['Since it was sunny, we had a picnic.','since']]},
 a4:{name:'Upgrade it',p:'Add a subordinate clause to each main clause. Try putting one at the start.',
  bank:{Conjunctions:['because','although','when','while','until','if','since','before']},
  items:[{base:'The dog barked.',ex:'The dog barked because a stranger knocked at the door.'},{base:'We ran home.',ex:'As soon as the storm began, we ran home.'},{base:'Zara won the race.',ex:'Although she had a sore ankle, Zara won the race.'}],
  chk:v=>{const c=findConj(v);if(!c)return'Add a subordinating conjunction such as because, when or although.';if(first(v)===c&&v.indexOf(',')<1)return'Your clause comes first, so add a comma after it.';return''}},
 ch:{emoji:'⚽🏆',scene:'The last minute of the cup final.',task:'Write three sentences, each with a <b>different</b> subordinating conjunction. Start at least one sentence with it.',hints:['start with the conjunction','put the clause at the end','your choice'],
  chk:(v,j,prev,prevC)=>{const c=findConj(v);if(!c)return'Use a subordinating conjunction.';if(prevC.includes(c))return'Use a different conjunction from your other sentences.';if(first(v)===c&&v.indexOf(',')<1)return'Add a comma after your opening clause.';return''},
  ex:['As the clock ticked down, the crowd held its breath.','Leo shot at goal although two defenders blocked his way.','When the ball hit the net, the whole stadium exploded with noise.']},
 look:['A subordinating conjunction in each sentence','A comma when the subordinate clause comes first','The main clause still makes sense on its own']},

{id:'relative',name:'Relative Clauses',blurb:'who, which, that, where, whose',
 learn:{what:'A <b>relative clause</b> adds extra information about a noun. It starts with a <b>relative pronoun</b>: <b>who, which, that, where, when</b> or <b>whose</b>.',
  ex:[['My aunt lives in Dubai.','My aunt, <mark>who loves cooking,</mark> lives in Dubai.','who'],['The cake was delicious.','The cake <mark>that Dad baked</mark> was delicious.','that'],['This is the park.','This is the park <mark>where we learnt to ride our bikes</mark>.','where']],
  why:'Relative clauses add detail without starting a new sentence.',
  tableTitle:'Which pronoun?',table:[['who','for people'],['which','for things and animals'],['that','for people or things'],['where','for places'],['when','for times'],['whose','shows belonging']],
  tip:'If the extra information could be removed, put commas around it.'},
 a1:{name:'Spot it',p:'Which sentence contains a relative clause?',items:[
  {o:['The girl who lives next door has a parrot.','The girl next door has a parrot.','The girl has a parrot next door.'],why:'“who lives next door” tells us about the girl.'},
  {o:['The book, which was very old, fell apart.','The very old book fell apart.','The book fell apart because it was old.'],why:'“which was very old” is the relative clause.'},
  {o:['This is the café where we had pancakes.','We had pancakes at this café.','We had pancakes and then left.'],why:'“where we had pancakes” describes the café.'},
  {o:['The boy whose kite broke was upset.','The boy was upset about his kite.','The boy’s kite broke and he was upset.'],why:'“whose kite broke” tells us about the boy.'}]},
 a2:{name:'Pick the pronoun',p:'Which relative pronoun fits?',opts:['who','which','where','whose'],items:[
  {q:'The girl ___ won the race was delighted.',c:0,why:'It is a person.'},
  {q:'The bridge, ___ was built in 1890, is closed.',c:1,why:'It is a thing.'},
  {q:'That is the beach ___ we found the shell.',c:2,why:'It is a place.'},
  {q:'The boy ___ dog ran away was upset.',c:3,why:'It shows belonging: the boy’s dog.'},
  {q:'Our teacher, ___ is very funny, told a joke.',c:0,why:'It is a person.'}]},
 a3:{name:'Find the pronoun',mode:'word',p:'Tap the relative pronoun.',items:[['The film, which lasted three hours, was brilliant.','which'],['I met a man who juggles fire.','who'],['This is the house where I was born.','where'],['Sara, whose cat is called Pebble, lives next door.','whose']]},
 a4:{name:'Upgrade it',p:'Add a relative clause to give more information about the noun.',
  bank:{Pronouns:['who','which','that','where','whose']},
  items:[{base:'The astronaut waved.',ex:'The astronaut, who had been in space for six months, waved.'},{base:'My bike is red.',ex:'My bike, which I got for my birthday, is red.'},{base:'The forest was dark.',ex:'The forest where the wolves lived was dark.'}],
  chk:v=>!findRel(v)?'Add a relative pronoun: who, which, that, where or whose.':''},
 ch:{emoji:'🦖🏛️',scene:'A school trip to see a dinosaur skeleton.',task:'Write three sentences, each with a <b>different</b> relative pronoun.',hints:['use who','use which or that','use where or whose'],
  chk:(v,j,prev,prevC)=>{const r=findRel(v);if(!r)return'Use a relative pronoun.';if(prevC.includes(r))return'Use a different relative pronoun.';return''},
  ex:['Our guide, who wore a dinosaur badge, led us inside.','The skeleton, which was taller than a bus, towered over us.','We visited the room where the fossils were cleaned.']},
 look:['The right pronoun for people, things and places','Commas around extra information','The sentence still makes sense without the relative clause']},

{id:'parenthesis',name:'Parenthesis',blurb:'Extra information in brackets, dashes or commas',
 learn:{what:'<b>Parenthesis</b> is extra information added into a sentence. If you took it out, the sentence would still make sense. Mark it with <b>brackets ( )</b>, <b>dashes – –</b> or <b>commas , ,</b>.',
  ex:[['Mr Lee loves jokes.','Mr Lee <mark>(our head teacher)</mark> loves jokes.','brackets'],['The cheetah can reach 110 km/h.','The cheetah <mark>– the fastest land animal –</mark> can reach 110 km/h.','dashes'],['My brother plays the drums.','My brother<mark>, who is twelve,</mark> plays the drums.','commas']],
  why:'Parenthesis adds useful facts or a little aside without needing a new sentence.',
  tableTitle:'Three ways',table:[['Brackets','quiet extra detail'],['Dashes','more dramatic or informal'],['Commas','a smooth, natural pause']],
  tip:'Parenthesis always comes in pairs: open and close it.'},
 a1:{name:'Spot it',p:'Which sentence uses parenthesis correctly?',items:[
  {o:['Paris (the capital of France) is beautiful.','Paris (the capital of France is beautiful.','Paris the capital of France) is beautiful.'],why:'The brackets open and close around the extra information.'},
  {o:['Our dog – a huge Great Dane – loves cuddles.','Our dog – a huge Great Dane loves cuddles.','Our – dog a huge Great Dane – loves cuddles.'],why:'Both dashes are there, around the extra detail.'},
  {o:['Ben, my best friend, is coming to tea.','Ben, my best friend is coming to tea.','Ben my best, friend is coming to tea.'],why:'A comma on each side of the extra information.'},
  {o:['The Nile (6,650 km long) flows into the sea.','The Nile 6,650 km long) flows into the sea.','The (Nile 6,650 km long) flows into the sea.'],why:'Brackets wrap only the extra detail.'}]},
 a2:{name:'Name it',p:'Which punctuation marks the parenthesis?',opts:['Brackets','Dashes','Commas'],items:[
  {q:'My grandma (who is 80) still swims every day.',c:0,why:'( ) are brackets.'},
  {q:'The storm – the worst for years – knocked down trees.',c:1,why:'– – are dashes.'},
  {q:'Penguins, which cannot fly, are excellent swimmers.',c:2,why:'The commas mark the extra information.'},
  {q:'Mount Everest – 8,849 metres tall – is the highest mountain.',c:1,why:'Dashes.'},
  {q:'The museum (open every day) is free to visit.',c:0,why:'Brackets.'}]},
 a3:{name:'Close it',mode:'gap',mark:')',p:'Each sentence is missing its closing bracket. Tap where it goes.',items:['Paris (the capital of France| is beautiful.','Our cat (a fluffy ginger tom| sleeps all day.','My best friend (who lives next door| is coming to tea.','The Moon (Earth’s only natural satellite| orbits every 27 days.']},
 a4:{name:'Upgrade it',p:'Add extra information to each sentence using brackets, dashes or commas.',
  bank:{Examples:['(aged 70)','– the oldest in town –',', who loves gardening,','(our neighbour)']},
  items:[{base:'My grandad grows tomatoes.',ex:'My grandad (a keen gardener) grows tomatoes.'},{base:'The volcano erupted.',ex:'The volcano – silent for 200 years – erupted.'},{base:'Our teacher told a joke.',ex:'Our teacher, who is very funny, told a joke.'}],
  chk:v=>{const b=/\(.+\)/.test(v),d=(v.match(/\s[–—-]\s/g)||[]).length>=2,c=(v.match(/,/g)||[]).length>=2;return b||d||c?'':'Add a pair of brackets, dashes or commas around the extra information.'}},
 ch:{emoji:'🐋📘',scene:'A fact file about the blue whale.',task:'Write three facts. Use <b>brackets</b> in the first, <b>dashes</b> in the second and <b>commas</b> in the third.',hints:['use brackets ( )','use dashes – –','use commas , ,'],
  chk:(v,j)=>j===0&&!/\(.+\)/.test(v)?'Use a pair of brackets.':j===1&&(v.match(/\s[–—-]\s/g)||[]).length<2?'Use a pair of dashes with spaces either side.':j===2&&(v.match(/,/g)||[]).length<2?'Use a pair of commas.':'',
  ex:['The blue whale (the largest animal ever) can grow to 30 metres.','Its heart – as big as a small car – beats only a few times a minute.','Blue whales, which eat tiny krill, can swallow tonnes of food a day.']},
 look:['Parenthesis in pairs (open and close)','The sentence still makes sense without it','The extra information is useful or interesting']},

{id:'showtell',name:'Show, Don’t Tell',blurb:'Show feelings through actions and senses',
 learn:{what:'Instead of <b>telling</b> the reader how a character feels, <b>show</b> it through what they do, say, see, hear or feel. Let the reader work it out!',
  ex:[['Sam was scared.','<mark>Sam’s hands trembled and his heart thudded against his ribs.</mark>','scared'],['It was cold.','<mark>Frost crunched under our boots and our breath hung like smoke.</mark>','cold'],['Mia was happy.','<mark>Mia skipped down the path, humming to herself.</mark>','happy']],
  why:'Showing makes the reader feel like they are inside the story.',
  tableTitle:'Ways to show',table:[['Actions','she slammed the door'],['Body language','his shoulders slumped'],['Face','her eyes widened'],['Speech','“Leave me alone!”'],['Senses','sweat trickled down his neck']],
  tip:'Look for “was” + a feeling word (sad, angry, excited) and replace it with clues.'},
 a1:{name:'Spot it',p:'Which sentence SHOWS the feeling instead of telling it?',items:[
  {o:['Jake slammed his book down and glared at the wall.','Jake was really angry.','Jake felt angry about his book.'],why:'We work out he is angry from his actions.'},
  {o:['Priya’s lip wobbled as she stared at the broken vase.','Priya was upset.','Priya felt sad about the vase.'],why:'The wobbling lip shows she is upset.'},
  {o:['Theo bounced on his toes, grinning at the door.','Theo was excited.','Theo felt very excited.'],why:'Bouncing and grinning show excitement.'},
  {o:['Lena’s teeth chattered and she hugged her knees.','Lena was freezing.','Lena felt cold.'],why:'Chattering teeth show she is cold.'}]},
 a2:{name:'Read the clues',p:'Which feeling is being shown?',opts:['Scared','Angry','Happy','Sad','Nervous'],items:[
  {q:'Jake stamped his foot and slammed the door.',c:1,why:'Stamping and slamming show anger.'},
  {q:'A tear rolled down her cheek as she stared at the empty cage.',c:3,why:'A tear and an empty cage suggest sadness.'},
  {q:'Her knees knocked and she couldn’t stop biting her nails.',c:4,why:'Knocking knees and nail-biting show nerves.'},
  {q:'He punched the air and grinned from ear to ear.',c:2,why:'Punching the air and grinning show happiness.'},
  {q:'Ben froze, eyes wide, as the shadow crept closer.',c:0,why:'Freezing with wide eyes shows fear.'}]},
 a3:{name:'Spot the tell',mode:'word',p:'Tap the word that TELLS the feeling. This is the word to replace.',items:[['Ava was really excited about the trip.','excited'],['The old man felt lonely.','lonely'],['Ruby was furious with her brother.','furious'],['Max felt nervous before his test.','nervous']]},
 a4:{name:'Upgrade it',p:'Rewrite each sentence to SHOW the feeling. Don’t use the feeling word!',
  bank:{'Body clues':['yawned','rubbed her eyes','clenched his fists','jaw dropped','eyes widened','stomped','shoulders slumped']},
  items:[{base:'Lucy was tired.',bad:'tired',ex:'Lucy yawned, rubbed her eyes and slumped onto the sofa.'},{base:'The boy was angry.',bad:'angry',ex:'The boy clenched his fists and stomped up the stairs.'},{base:'Oscar was surprised.',bad:'surprised',ex:'Oscar’s jaw dropped and his eyes widened.'}],
  noKeep:1,chk:(v,b,it)=>nrm(v).split(' ').includes(it.bad)?`Don’t use the word “${it.bad}”. Show it instead.`:wc(v)<7?'Add more clues (at least 7 words).':''},
 ch:{emoji:'🎤🏆',scene:'Waiting to hear who won the school talent show.',task:'Write three sentences that SHOW how your character feels. Don’t name the feelings!',hints:['show nerves while waiting','show the moment the winner is called','show their reaction'],
  chk:v=>/\b(nervous|happy|excited|scared|sad|worried|anxious|surprised|thrilled|delighted)\b/.test(lc(v))?'Don’t name the feeling. Show it with clues.':wc(v)<8?'Add more detail (at least 8 words).':'',
  ex:['Amira twisted her sleeve and stared at the stage lights.','When her name echoed round the hall, she gasped and clapped a hand over her mouth.','She floated up the steps, grinning so wide her cheeks ached.']},
 look:['No “telling” feeling words','Clues from actions, body language, speech and senses','The reader can guess the feeling']}

function worksheet(F){
  const SECT=[['learn','Learn'],['a1','1 · '+F.a1.name],['a2','2 · '+F.a2.name],['a3','3 · '+F.a3.name],['a4','4 · '+F.a4.name],['ch','Challenge'],['par','For parents']];
  main.innerHTML=`<section class="act eng">${head('eng','English · Writing',F.name)}
   <div class="chips" id="es">${SECT.map(s=>`<button class="chip" data-s="${s[0]}">${s[1]}</button>`).join('')}</div><div id="eb"></div></section>`;
  const eb=$('#eb'),FN={learn,a1,a2,a3,a4,ch,par};
  function open(k){$('#es').querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.s===k));eb.innerHTML='';FN[k]()}
  $('#es').onclick=e=>{const c=e.target.closest('.chip');if(c)open(c.dataset.s)};
  function el(html){const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild}
  const nextBtn=k=>{const b=el(`<div style="margin-top:18px"><button class="btn primary">Next: ${SECT.find(s=>s[0]===k)[1]} →</button></div>`);b.querySelector('button').onclick=()=>{open(k);window.scrollTo(0,0)};return b};
  const doneHTML=(s,n)=>`<div class="done-card"><div class="big-star">★</div><h2>${s} out of ${n}</h2></div>`;

  function learn(){const L=F.learn;
    const p=el(`<div class="panel prose"><h2>What is it?</h2><p>${L.what}</p>
     <div class="exs">${L.ex.map(x=>`<div class="ex"><small>Before</small>${x[0]}</div><div class="ex"><small>After · ${x[2]}</small>${x[1]}</div>`).join('')}</div>
     <p><b>Why use it?</b> ${L.why}</p><h3>${L.tableTitle}</h3>
     <div class="tablewrap"><table><tbody>${L.table.map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div>
     <div class="tip"><b>Tip</b> ${L.tip}</div></div>`);
    p.appendChild(nextBtn('a1'));eb.appendChild(p)}

  function mc(items,shared,after){const p=el(`<div class="panel"></div>`);eb.appendChild(p);let i=0,score=0;
    function show(){if(i>=items.length){p.innerHTML=doneHTML(score,items.length);p.appendChild(nextBtn(after));return}
      const it=items[i],sh=!it.o,raw=it.o||shared,opts=sh?raw.map((t,k)=>({t,ok:k===it.c})):shuffle(raw.map((t,k)=>({t,ok:k===(it.c??0)})));
      p.innerHTML=`<div class="dots">${items.map((_,k)=>`<i class="${k<i?'ok':k===i?'now':''}"></i>`).join('')}</div><div class="qpre">${it.p}</div>${it.q?`<div class="q small">${it.q}</div>`:''}
       <div class="opts" style="margin-top:12px">${opts.map((o,k)=>`<button class="btn" data-k="${k}">${o.t}</button>`).join('')}</div><div class="fb" style="margin-top:14px"></div>`;
      let lock=false;p.querySelector('.opts').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;lock=true;const o=opts[+b.dataset.k],fb=p.querySelector('.fb');
        b.classList.add(o.ok?'good':'bad');if(!o.ok)p.querySelectorAll('.opts .btn')[opts.findIndex(x=>x.ok)].classList.add('good');
        if(o.ok){score++;star()}tone(o.ok);fb.className='fb '+(o.ok?'ok':'no');fb.textContent=(o.ok?'Correct! ':'Not quite. ')+it.why;setTimeout(()=>{i++;show()},o.ok?1800:3400)}}
    show()}
  function a1(){mc(F.a1.items.map(x=>({...x,p:F.a1.p})),null,'a2')}
  function a2(){mc(F.a2.items.map(x=>({...x,p:F.a2.p})),F.a2.opts,'a3')}

  function a3(){const A=F.a3;const p=el(`<div class="panel"><div class="tip" style="margin-bottom:14px"><b>How to play</b> ${A.p}</div><div class="dots"></div><div class="gaps"></div><div class="fb" style="margin-top:14px"></div></div>`);eb.appendChild(p);let i=0,score=0;
    function show(){if(i>=A.items.length){p.innerHTML=doneHTML(score,A.items.length);p.appendChild(nextBtn('a4'));return}
      p.querySelector('.dots').innerHTML=A.items.map((_,j)=>`<i class="${j<i?'ok':j===i?'now':''}"></i>`).join('');
      const g=p.querySelector('.gaps'),fb=p.querySelector('.fb');let tries=0,lock=false;
      if(A.mode==='gap'){const s=A.items[i],k=s.split('|')[0].trim().split(/\s+/).length,w=s.replace('|','').split(/\s+/);
        g.innerHTML=w.map((x,j)=>`<span class="w">${x}</span>${j<w.length-1?`<button class="gap" data-g="${j+1}" aria-label="After ${x}">^</button>`:''}`).join('');
        g.onclick=e=>{const b=e.target.closest('.gap');if(!b||lock)return;const ok=+b.dataset.g===k;tone(ok);
          if(ok){lock=true;b.textContent=A.mark;b.classList.add('ok');if(!tries){score++;star()}fb.className='fb ok';fb.textContent='Yes! That’s the spot.';setTimeout(()=>{fb.textContent='';i++;show()},1800)}
          else{tries++;b.classList.add('no');fb.className='fb no';fb.textContent='Not there. Read it aloud and try again.'}}}
      else{const [s,t]=A.items[i],w=s.split(/\s+/);
        g.innerHTML=w.map((x,j)=>`<button class="wbtn" data-j="${j}">${x}</button>`).join(' ');
        g.onclick=e=>{const b=e.target.closest('.wbtn');if(!b||lock)return;const ok=nrm(b.textContent).replace(/'.*$/,'')===t||nrm(b.textContent)===t;tone(ok);
          if(ok){lock=true;b.classList.add('ok');if(!tries){score++;star()}fb.className='fb ok';fb.textContent=`Yes! “${t}”.`;setTimeout(()=>{fb.textContent='';i++;show()},1800)}
          else{tries++;b.classList.add('no');fb.className='fb no';fb.textContent='Not that one. Try again.'}}}}
    show()}

  function a4(){const A=F.a4;
    const p=el(`<div class="panel prose"><p style="margin-top:0">${A.p}</p>
     <div class="bank"><span class="lbl">Word bank · tap to add</span>${Object.entries(A.bank).map(([k,v])=>`<div><small class="bk">${k}</small><div class="chips">${v.map(x=>`<button class="chip" data-w="${x}">${x}</button>`).join('')}</div></div>`).join('')}</div>
     <div class="writes">${A.items.map((it,j)=>`<div class="wrow"><label class="lbl" for="up${j}">${j+1}. ${it.base}${it.label?` · use a ${it.label}`:''}</label><textarea id="up${j}" rows="2" placeholder="Write your new sentence here" autocapitalize="sentences"></textarea><div class="fb" id="uf${j}"></div></div>`).join('')}</div>
     <button class="btn primary" id="uc">Check my sentences</button></div>`);eb.appendChild(p);
    let last=p.querySelector('#up0');const won=A.items.map(()=>0);p.querySelectorAll('textarea').forEach(t=>t.onfocus=()=>last=t);
    p.querySelector('.bank').onclick=e=>{const c=e.target.closest('.chip');if(!c)return;const v=last.value,s=last.selectionStart??v.length,w=c.dataset.w;last.value=v.slice(0,s)+(s&&!/\s$/.test(v.slice(0,s))?' ':'')+w+' '+v.slice(s);last.focus()};
    p.querySelector('#uc').onclick=()=>A.items.forEach((it,j)=>{const v=p.querySelector('#up'+j).value.trim(),fb=p.querySelector('#uf'+j);
      let msg=basic(v)||A.chk(v,it.base,it)||'';if(!msg&&!A.noKeep&&!it.key&&!keeps(v,it.base))msg='Keep the words from the original sentence.';
      const ok=!msg;fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'Brilliant sentence!':msg;if(ok&&!won[j]){won[j]=1;star();tone(true)}});
    p.appendChild(nextBtn('ch'))}

  function ch(){const C=F.ch;
    const p=el(`<div class="panel prose"><div class="scene"><span>${C.emoji}</span><div><span class="lbl">Challenge for confident writers</span><h3 style="margin:0">${C.scene}</h3></div></div><p>${C.task}</p>
     ${C.hints.map((t,j)=>`<div class="wrow"><label class="lbl" for="cs${j}">Sentence ${j+1} · ${t}</label><textarea id="cs${j}" rows="2" autocapitalize="sentences"></textarea><div class="fb" id="cf${j}"></div></div>`).join('')}
     <button class="btn primary" id="cc">Check</button></div>`);eb.appendChild(p);const won=[0,0,0];
    p.querySelector('#cc').onclick=()=>{const prev=[],prevC=[];C.hints.forEach((_,j)=>{const v=p.querySelector('#cs'+j).value.trim(),fb=p.querySelector('#cf'+j);
      let msg=basic(v)||C.chk(v,j,prev,prevC)||'';prev.push(first(v));prevC.push((F.id==='relative'?findRel(v):findConj(v))||'');
      const ok=!msg;fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'Great sentence. Read it aloud to check it sounds right.':msg;if(ok&&!won[j]){won[j]=1;star();tone(true)}})};
    p.appendChild(nextBtn('par'))}

  function par(){const ans1=F.a1.items.map(x=>`<li>${x.q?x.q.replace(/<[^>]+>/g,'')+' → ':''}${x.o[0]}</li>`).join('');
    const ans2=F.a2.items.map(x=>`<tr><td>${x.q}</td><td><b>${(x.o||F.a2.opts)[x.c]}</b></td></tr>`).join('');
    const ans3=F.a3.items.map(x=>F.a3.mode==='gap'?`<li>${x.replace('|',F.a3.mark)}</li>`:`<li>${x[0]} → <b>${x[1]}</b></li>`).join('');
    eb.appendChild(el(`<div class="panel prose"><h2>Answers for parents</h2>
     <h3>1 · ${F.a1.name}</h3><ol>${ans1}</ol>
     <h3>2 · ${F.a2.name}</h3><div class="tablewrap"><table><tbody>${ans2}</tbody></table></div>
     <h3>3 · ${F.a3.name}</h3><ol>${ans3}</ol>
     <h3>4 · ${F.a4.name} (example answers)</h3><ol>${F.a4.items.map(x=>`<li>${x.ex}</li>`).join('')}</ol>
     <h3>Challenge (example)</h3><ul>${F.ch.ex.map(x=>`<li>${x}</li>`).join('')}</ul>
     <h3>What to look for</h3><ul>${F.look.map(x=>`<li>${x}</li>`).join('')}<li>Capital letter at the start, full stop at the end</li></ul>
     ${F.note?`<div class="tip"><b>Note</b> ${F.note}</div>`:''}</div>`))}
  open('learn');
}

    const [qq,raw,why,pic,spoken]=deck[i],opts=shuffle(raw.map((o,k)=>({e:o[0],t:o[1],ok:k===0})));

/* ---------- Newton maths ---------- */
const NEWT={
 fma:()=>{const m=R(2,20),a=R(2,10);return{p:'F = m × a',t:`A ${m} kg trolley accelerates at ${a} m/s². What force is needed, in N?`,a:m*a,s:1,why:`${m} × ${a} = ${m*a} N.`}},
 acc:()=>{const m=R(2,15),a=R(2,10);return{p:'a = F ÷ m',t:`A force of ${m*a} N pushes a ${m} kg box. What is its acceleration, in m/s²?`,a:a,s:1,why:`${m*a} ÷ ${m} = ${a} m/s².`}},
 mass:()=>{const m=R(2,25),a=R(2,8);return{p:'m = F ÷ a',t:`A ${m*a} N force gives an object an acceleration of ${a} m/s². What is its mass, in kg?`,a:m,s:1,why:`${m*a} ÷ ${a} = ${m} kg.`}},
 weight:()=>{const m=R(2,80);return{p:'Weight = m × g   (g = 10 N/kg on Earth)',t:`What is the weight of a ${m} kg ${m>30?'child':'suitcase'} on Earth, in N?`,a:m*10,s:1,why:`${m} × 10 = ${m*10} N.`}},
 moon:()=>{const m=R(3,60)*2;return{p:'On the Moon, g ≈ 1.6 N/kg',t:`An astronaut’s kit has a mass of ${m} kg. What does it weigh on the Moon, in N?`,a:Math.round(m*1.6*10)/10,s:1,why:`${m} × 1.6 = ${Math.round(m*16)/10} N. Same mass, less weight.`}},
 net:()=>{const a=R(20,90),b=R(5,a-5);return{p:'Resultant force = bigger force − smaller force (opposite directions)',t:`A box is pushed right with ${a} N. Friction pulls left with ${b} N. What is the resultant force, in N?`,a:a-b,s:1,why:`${a} − ${b} = ${a-b} N to the right.`}},
 two:()=>{const m=R(2,10),acc=R(2,6),fr=R(5,30),push=m*acc+fr;return{p:'Find the resultant force first, then a = F ÷ m',t:`A ${m} kg sledge is pulled with ${push} N. Friction is ${fr} N. What is its acceleration, in m/s²?`,a:acc,s:1,why:`${push} − ${fr} = ${m*acc} N, then ${m*acc} ÷ ${m} = ${acc} m/s².`}},
 speed:()=>{const a=R(2,6),t=R(2,10),u=R(0,1)*R(2,10);return{p:'Final speed = start speed + a × t',t:`A car going ${u} m/s accelerates at ${a} m/s² for ${t} s. What is its final speed, in m/s?`,a:u+a*t,s:1,why:`${u} + ${a} × ${t} = ${u+a*t} m/s.`}}
};

const FLIGHT=[
 {t:'The Four Forces of Flight',blurb:'Lift, weight, thrust and drag',fig:FORCES_SVG,links:LINKS.forces,
  read:`<p>Every aeroplane in the sky is in a tug-of-war between <b>four forces</b>.</p>
   <p><b>Weight</b> is the pull of gravity, pulling the plane down towards Earth. <b>Lift</b> pushes the plane up. It is made by the wings as air flows over them. <b>Thrust</b> pushes the plane forwards. It comes from the engines or propellers. <b>Drag</b> is air resistance. It pushes backwards and tries to slow the plane down.</p>
   <p>To take off, lift must be <b>bigger</b> than weight. To speed up, thrust must be bigger than drag. When a plane cruises at a steady height and speed, the forces are <b>balanced</b>: lift equals weight and thrust equals drag.</p>`,
  fact:'A fully loaded Airbus A380 can weigh about 575 tonnes at take-off. Its wings still lift it into the air!',
  qs:[{q:'Which force pulls a plane down towards Earth?',o:['Weight','Lift','Thrust'],why:'Weight is caused by gravity.'},
   {q:'Which force do the engines produce?',o:['Thrust','Lift','Drag'],why:'Engines and propellers push the plane forwards.'},
   {q:'For a plane to climb, lift must be…',o:['Bigger than weight','Smaller than weight','Equal to drag'],why:'More upward force than downward force.'},
   {q:'Drag acts in which direction?',o:['Backwards, against the motion','Upwards','Forwards'],why:'Drag is air resistance, so it opposes motion.'},
   {q:'A plane cruises at a steady speed and height. Its forces are…',o:['Balanced','Unbalanced','All zero'],why:'Lift = weight and thrust = drag.'}]},
 {t:'How Wings Make Lift',blurb:'Aerofoils and angle of attack',links:LINKS.aero,
  read:`<p>A wing has a special shape called an <b>aerofoil</b>. It is rounded at the front, curved on top and thin at the back.</p>
   <p>The wing is tilted slightly upwards. This tilt is called the <b>angle of attack</b>. As the plane moves, the wing pushes air <b>downwards</b>. By Newton’s third law, the air pushes the wing <b>upwards</b>. That push is lift!</p>
   <p>Air also flows faster over the curved top of the wing. Faster-moving air has <b>lower pressure</b>, so the higher pressure underneath pushes the wing up. Faster flying means more lift. But if the angle of attack is too steep, the smooth airflow breaks up and the wing suddenly loses lift. This is called a <b>stall</b>.</p>`,
  fact:'Birds change the shape and angle of their wings all the time to control their lift.',
  qs:[{q:'What is the special shape of a wing called?',o:['An aerofoil','A propeller','A rudder'],why:'Aerofoils are curved to make lift.'},
   {q:'The upward tilt of a wing is called the…',o:['Angle of attack','Angle of drag','Wing span'],why:'It is the angle the wing meets the air.'},
   {q:'The wing pushes air down, so the air pushes the wing up. Which law is this?',o:['Newton’s third law','Newton’s first law','The law of gravity'],why:'Equal and opposite reaction.'},
   {q:'Air flowing faster over the top of the wing has…',o:['Lower pressure','Higher pressure','No pressure'],why:'Faster air means lower pressure, so the wing is pushed up.'},
   {q:'What happens if the angle of attack is too steep?',o:['The wing stalls and loses lift','The plane goes faster','Drag disappears'],why:'The smooth airflow breaks up.'}]},
 {t:'Drag and Streamlining',blurb:'Why shape matters',links:LINKS.aero,
  read:`<p><b>Drag</b> is the force of air pushing against anything that moves through it. You feel it when you hold your hand out of a car window.</p>
   <p>Three things change how much drag there is: the <b>shape</b> of the object, its <b>speed</b>, and its <b>surface</b>. A smooth, pointed shape lets air flow around it easily. We call this shape <b>streamlined</b>. Going faster makes drag much bigger.</p>
   <p>Engineers streamline planes, cars and trains to save fuel. But sometimes drag is useful! Parachutes and a plane’s <b>air brakes</b> are designed to make lots of drag and slow things down.</p>`,
  fact:'If you double your speed, the drag on you becomes about four times bigger.',
  qs:[{q:'Drag is another name for…',o:['Air resistance','Gravity','Lift'],why:'It is the force of air pushing against a moving object.'},
   {q:'Which shape has the least drag?',o:['A smooth, pointed shape','A flat sheet facing the wind','A rough box'],why:'Streamlined shapes let air flow round easily.'},
   {q:'What happens to drag when you go faster?',o:['It increases','It decreases','It stays the same'],why:'Faster speed means much more drag.'},
   {q:'Why do engineers streamline trains?',o:['To save energy and fuel','To make them heavier','To make more noise'],why:'Less drag means less energy is needed.'},
   {q:'Which of these is designed to make lots of drag?',o:['A parachute','A racing car nose','A dolphin’s body'],why:'More drag slows the parachutist down safely.'}]},
 {t:'Wind Tunnels',blurb:'Testing flight on the ground',links:LINKS.tunnel,
  read:`<p>Testing a new plane by flying it is risky and expensive. So engineers use a <b>wind tunnel</b>. Instead of moving the model through the air, a giant fan moves the air past a model that stays still.</p>
   <p>The model sits on a <b>balance</b> that measures the forces on it, like lift and drag. Scientists add <b>smoke</b> or tiny threads so they can see how the air flows around the shape.</p>
   <p>The Wright brothers built their own small wind tunnel in 1901. They tested around 200 different wing shapes before building the first successful powered aeroplane in 1903. Today, wind tunnels test planes, racing cars, bikes, buildings and even sports clothing.</p>`,
  fact:'Some NASA wind tunnels are big enough to test a full-size aeroplane.',
  qs:[{q:'In a wind tunnel, what moves?',o:['The air','The model','The tunnel walls'],why:'A fan blows air past a model that stays still.'},
   {q:'What do scientists use to see the airflow?',o:['Smoke or threads','Magnets','Mirrors'],why:'Smoke shows the path of the air.'},
   {q:'What does the balance in a wind tunnel measure?',o:['The forces on the model','The temperature','The model’s colour'],why:'It measures forces such as lift and drag.'},
   {q:'Why do engineers use wind tunnels?',o:['It is safer and cheaper than test flights','Planes cannot fly outside','To paint the models'],why:'They can test lots of designs safely on the ground.'},
   {q:'About how many wing shapes did the Wright brothers test?',o:['About 200','About 2','About 2 million'],why:'Their 1901 tunnel tests helped them design the 1903 Flyer.'}]},
 {t:'Steering a Plane',blurb:'Roll, pitch and yaw',links:LINKS.forces,
  read:`<p>A plane can turn in three ways. <b>Roll</b> tips the wings left or right. <b>Pitch</b> moves the nose up or down. <b>Yaw</b> swings the nose left or right.</p>
   <p>Pilots control these with hinged flaps called <b>control surfaces</b>. The <b>ailerons</b> on the wing tips control roll. The <b>elevator</b> on the tail controls pitch. The <b>rudder</b> on the tail fin controls yaw.</p>
   <p>Each control surface works by changing how the air pushes on that part of the plane. For landing, pilots also lower <b>flaps</b> on the wings. They add extra lift so the plane can fly slowly and safely.</p>`,
  fact:'Turning a plane usually uses roll and yaw together, just like a cyclist leaning into a bend.',
  qs:[{q:'Which movement tips the wings left or right?',o:['Roll','Pitch','Yaw'],why:'Roll tilts the wings.'},
   {q:'Which control surface moves the nose up or down?',o:['The elevator','The rudder','The ailerons'],why:'The elevator controls pitch.'},
   {q:'The rudder controls…',o:['Yaw','Roll','Thrust'],why:'It swings the nose left or right.'},
   {q:'Where are the ailerons?',o:['Near the wing tips','On the engine','On the nose'],why:'Ailerons sit on the outer part of each wing.'},
   {q:'Why do pilots lower the flaps to land?',o:['To add lift at slow speeds','To go faster','To turn left'],why:'Extra lift lets the plane fly slowly and safely.'}]}
];

       <div style="margin-top:12px"><button class="btn" id="peek" style="font-size:16px;padding:8px 14px">Look back at the lesson</button></div></div>`;
      $('#peek').onclick=reading;
      let lock=false;lb.querySelector('.opts').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;lock=true;const o=opts[+b.dataset.k],fb=lb.querySelector('.fb');
        b.classList.add(o.ok?'good':'bad');if(!o.ok)lb.querySelectorAll('.opts .btn')[opts.findIndex(x=>x.ok)].classList.add('good');

function track(){

  const g=9.8,L=20;let surf='wood',push=5,zone,x=0,running=false,raf,cv,ctx,W,H=240,t0,v0,a,d,crash;
  main.innerHTML=`<section class="act phys">${head('phys','Physics','Friction Track','<button class="btn" id="newz">New parking zone</button>')}
   <p class="lead" style="margin:0">Choose a surface and how hard to push. Park the cart inside the green zone to win a star. More friction means the cart stops sooner.</p>
   <div class="stage"><canvas id="cv"></canvas></div>
   <div class="ctrls"><div><span class="lbl">Surface</span><div class="chips" id="sf">${Object.keys(SURF).map(k=>`<button class="chip" data-s="${k}">${SURF[k].n}</button>`).join('')}</div></div>
    <div><label class="lbl" for="pw">Push strength: <span id="pwv">5</span> / 10</label><input id="pw" type="range" min="1" max="10" step="0.5" value="5"></div>
    <button class="btn primary" id="go" style="font-size:24px">Push!</button></div>
   <div class="readouts"><div class="ro"><small>Start speed</small><b id="r1">–</b></div><div class="ro"><small>Speed now</small><b id="r2">–</b></div><div class="ro"><small>Distance</small><b id="r3">0.0 m</b></div><div class="ro"><small>Friction</small><b id="r4">–</b></div></div>
   <div class="fb" id="fb"></div></section>`;
  cv=$('#cv');
  const resize=()=>{({x:ctx,w:W}=fitCanvas(cv,H));draw()};
  function newZone(){zone=R(5,15)+(Math.random()<.5?.5:0);x=0;$('#fb').textContent='';$('#fb').className='fb';draw()}
  function draw(){if(!ctx)return;const m=28,sc=(W-2*m-14)/L,gy=H-70,s=SURF[surf];ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#F7FBFF';ctx.fillRect(0,0,W,gy);
    ctx.fillStyle='rgba(30,158,84,.16)';ctx.fillRect(m+zone*sc,gy-110,2*sc,110);ctx.setLineDash([6,5]);ctx.strokeStyle='#1E9E54';ctx.lineWidth=2;ctx.strokeRect(m+zone*sc,gy-110,2*sc,110);ctx.setLineDash([]);
    ctx.fillStyle='#1E9E54';ctx.font='700 13px "Atkinson Hyperlegible",sans-serif';ctx.textAlign='center';ctx.fillText('PARK HERE',m+(zone+1)*sc,gy-118+2<12?14:gy-118);
    ctx.fillStyle=s.c;ctx.fillRect(m,gy,L*sc,18);ctx.fillStyle=s.t;for(let k=0;k<L*sc;k+=10)ctx.fillRect(m+k,gy+(k/10%2?4:10),5,3);
    ctx.fillStyle='#1D2A44';ctx.fillRect(m+L*sc,gy-120,14,138);
    ctx.strokeStyle='#1D2A44';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m,gy+18);ctx.lineTo(m+L*sc,gy+18);ctx.stroke();
    ctx.font='700 12px "Atkinson Hyperlegible",sans-serif';for(let k=0;k<=L;k++){const px=m+k*sc;ctx.beginPath();ctx.moveTo(px,gy+18);ctx.lineTo(px,gy+(k%2?25:30));ctx.stroke();if(k%2===0)ctx.fillText(k+' m',px,gy+46)}
    const cx=m+x*sc,cw=46,ch=26;ctx.fillStyle='#2F86D6';ctx.strokeStyle='#1D2A44';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect?ctx.roundRect(cx-cw/2,gy-ch-12,cw,ch,6):ctx.rect(cx-cw/2,gy-ch-12,cw,ch);ctx.fill();ctx.stroke();
    ctx.fillStyle='#FFC83D';[cx-13,cx+13].forEach(wx=>{ctx.beginPath();ctx.arc(wx,gy-7,7,0,7);ctx.fill();ctx.stroke()});
    ctx.fillStyle='#1D2A44';ctx.beginPath();ctx.moveTo(cx,gy-ch-12);ctx.lineTo(cx,gy-ch-30);ctx.stroke();ctx.fillStyle='#FFC83D';ctx.fillRect(cx,gy-ch-30,14,9);ctx.strokeRect(cx,gy-ch-30,14,9)}
  function launch(){if(running)return;running=true;x=0;v0=push*0.8;a=SURF[surf].mu*g;d=v0*v0/(2*a);crash=d>L-0.4;t0=performance.now();
    $('#r1').textContent=v0.toFixed(1)+' m/s';$('#r4').textContent=SURF[surf].n;$('#fb').textContent='';$('#go').disabled=true;
    const tStop=v0/a;const step=now=>{let t=(now-t0)/1000*2.2;if(t>tStop)t=tStop;x=v0*t-.5*a*t*t;let v=v0-a*t;
      if(crash&&x>=L-0.4){x=L-0.4;v=0;t=tStop}
      $('#r2').textContent=v.toFixed(1)+' m/s';$('#r3').textContent=x.toFixed(1)+' m';draw();
      if(t<tStop)raf=requestAnimationFrame(step);else finish()};raf=requestAnimationFrame(step)}
  function finish(){running=false;$('#go').disabled=false;const fb=$('#fb'),inZ=x>=zone&&x<=zone+2;
    if(crash){fb.className='fb no';fb.textContent='Crash! Too fast for this surface. Push gentler or pick more friction.';tone(false)}
    else if(inZ){fb.className='fb ok';fb.textContent=`Parked at ${x.toFixed(1)} m. Perfect! New zone coming…`;star();tone(true);setTimeout(newZone,2200)}
    else{fb.className='fb no';fb.textContent=x<zone?`Stopped at ${x.toFixed(1)} m. Too short: push harder or choose less friction.`:`Stopped at ${x.toFixed(1)} m. Too far: push gentler or choose more friction.`;tone(false)}}
  $('#sf').onclick=e=>{const c=e.target.closest('.chip');if(!c||running)return;surf=c.dataset.s;$('#sf').querySelectorAll('.chip').forEach(k=>k.setAttribute('aria-pressed',k===c));x=0;draw()};
  $('#sf').querySelector('[data-s=wood]').setAttribute('aria-pressed','true');
  $('#pw').oninput=e=>{push=+e.target.value;$('#pwv').textContent=push};
  $('#go').onclick=launch;$('#newz').onclick=()=>{if(!running)newZone()};
  window.addEventListener('resize',resize);cleanup=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize)};
  zone=9;resize();
}

/* ---------- Y5 CHEMISTRY: Particle Lab ---------- */
function particles(){
  let temp=20,raf,ctx,W,H=320,P=[],wasSolid=false;const r=10,N=36,tasks={freeze:false,melt:false,boil:false};
  main.innerHTML=`<section class="act chem">${head('chem','Chemistry','Particle Lab')}
   <p class="lead" style="margin:0">Water is made of tiny particles. Change the temperature and watch how they move. Water freezes at 0 °C and boils at 100 °C.</p>
   <div class="tasks" id="tk"><span class="task" data-t="freeze">Freeze it</span><span class="task" data-t="melt">Melt it again</span><span class="task" data-t="boil">Boil it</span></div>
   <div class="split"><div class="stage"><canvas id="cv"></canvas></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:16px"><div class="readouts"><div class="ro"><small>Temperature</small><b id="tv">20 °C</b></div><div class="ro"><small>State</small><b id="sv">Liquid</b></div></div>
    <div><label class="lbl" for="tr">Heat or cool</label><input id="tr" type="range" min="-30" max="140" value="20"></div>
    <p id="info" style="margin:0"></p></div></div></section>`;
  const cv=$('#cv');
  const INFO={Solid:'Ice. Particles are packed tightly in a pattern. They vibrate but stay in place, so a solid keeps its shape.',Liquid:'Water. Particles are close together but slide past each other, so a liquid flows and takes the shape of its container.',Gas:'Steam. Particles are far apart and zoom around in every direction, filling the whole container.'};
  const state=()=>temp<0?'Solid':temp<100?'Liquid':'Gas';
  function targets(){const cols=6,sp=2*r+1,ox=W/2-(cols-1)*sp/2;P.forEach((p,k)=>{p.tx=ox+(k%cols)*sp;p.ty=H-20-r-Math.floor(k/cols)*sp})}
  const resize=()=>{({x:ctx,w:W}=fitCanvas(cv,H));if(!P.length)for(let k=0;k<N;k++)P.push({x:R(20,W-20),y:R(H/2,H-20),vx:Math.random()*2-1,vy:0});targets()};
  function tick(){const s=state(),wl=14,wr=W-14,wb=H-14,wt=12;
    for(const p of P){if(s==='Solid'){const amp=.4+(temp+30)/18;p.x+=(p.tx-p.x)*.25+(Math.random()-.5)*amp;p.y+=(p.ty-p.y)*.25+(Math.random()-.5)*amp;p.vx=p.vy=0;continue}
      if(s==='Liquid'){p.vy+=.35;const k=.4+temp/60;p.vx+=(Math.random()-.5)*k;p.vy+=(Math.random()-.5)*k;p.vx*=.96;p.vy*=.96}
      else{const sp=Math.hypot(p.vx,p.vy)||1,tg=4+(temp-100)/12;p.vx*=1+(tg/sp-1)*.08;p.vy*=1+(tg/sp-1)*.08;if(sp<.5){p.vx=Math.random()*4-2;p.vy=-3}}
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<wl+r){p.x=wl+r;p.vx=Math.abs(p.vx)}if(p.x>wr-r){p.x=wr-r;p.vx=-Math.abs(p.vx)}
      if(p.y>wb-r){p.y=wb-r;p.vy=-Math.abs(p.vy)*(s==='Gas'?1:.3)}if(p.y<wt+r){p.y=wt+r;p.vy=Math.abs(p.vy)}}
    if(s!=='Solid')for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<2*r){const o=(2*r-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;if(s==='Gas'){const t=a.vx;a.vx=b.vx;b.vx=t;const u=a.vy;a.vy=b.vy;b.vy=u}}}
    ctx.clearRect(0,0,W,H);ctx.fillStyle=s==='Gas'?'#FFF6EE':'#F5FAFF';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1D2A44';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wl-2,8);ctx.lineTo(wl-2,wb+2);ctx.lineTo(wr+2,wb+2);ctx.lineTo(wr+2,8);ctx.stroke();
    for(const p of P){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=s==='Solid'?'#9FD4F5':s==='Liquid'?'#2F86D6':'#F07F5A';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#1D2A44';ctx.stroke();ctx.beginPath();ctx.arc(p.x-3,p.y-3,2.6,0,7);ctx.fillStyle='#ffffffcc';ctx.fill()}
    raf=requestAnimationFrame(tick)}
  function setT(v){temp=v;const s=state();$('#tv').textContent=v+' °C';$('#sv').textContent=s==='Solid'?'Solid (ice)':s==='Liquid'?'Liquid':'Gas (steam)';$('#info').textContent=INFO[s];
    const done=k=>{if(!tasks[k]){tasks[k]=true;star();tone(true);$(`[data-t=${k}]`).classList.add('done')}};
    if(s==='Solid'){wasSolid=true;done('freeze')}if(s==='Liquid'&&wasSolid)done('melt');if(s==='Gas')done('boil')}
  $('#tr').oninput=e=>setT(+e.target.value);
  window.addEventListener('resize',resize);cleanup=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize)};
  resize();setT(20);raf=requestAnimationFrame(tick);
}

  $('#pots').onclick=e=>{const b=e.target.closest('.pot');if(!b||pick.length>=2)return;pick.push(b.dataset.c);say(b.dataset.c);
    $('#bl').insertAdjacentHTML('beforeend',`<i style="background:${P[b.dataset.c]}"></i>`);
    if(pick.length===2){const key=[...pick].sort().join('+'),res=pick[0]===pick[1]?[pick[0],P[pick[0]]]:MIX[key],bw=$('#bw');
      bw.classList.remove('swirl');void bw.offsetWidth;bw.classList.add('swirl');bw.style.background=res[1];
      setTimeout(()=>{const ok=res[0]===target,fb=$('#fb'),msg=`${pick[0]} and ${pick[1]} make ${res[0]}!`;fb.className='fb '+(ok?'ok':'');fb.textContent=msg+(ok?' You did it!':'');tone(ok);
        if(ok){star();say(msg+' You did it!');setTimeout(()=>{reset();newT()},2600)}else say(msg+` Now try to make ${target}.`)},900)}};
  $('#rs').onclick=reset;$('#sp').onclick=()=>say(`Can you make ${target}? Pick two paints.`);
  reset();newT();
}

loadWeek();go(home);
</script>
