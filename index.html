<title>Little Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: chunky "lab toy" UI on graph paper — sticker buttons with ink outlines and press-down shadows; one subject colour per science. Deliberate single light theme for kids. */
:root{
  --paper:#F2F6F1; --grid:#DFE9E2; --card:#FFFFFF; --ink:#1D2A44; --muted:#5B6782;
  --sun:#FFC83D; --math:#7B5CD6; --math-soft:#ECE6FB; --phys:#2F86D6; --phys-soft:#E1EEFA;
  --chem:#14957F; --chem-soft:#DDF3EE; --good:#1E9E54; --bad:#D9483B;
  --display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --body:"Atkinson Hyperlegible",-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--body);font-size:18px;line-height:1.45;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;padding-inline:16px;padding-block:0 32px;min-height:100%;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:var(--ink);touch-action:manipulation;-webkit-user-select:none;user-select:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--phys);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;padding-block:12px;background:var(--paper)}
.brand{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:.5px;flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:26px;height:26px;border:3px solid var(--ink);border-radius:0 0 12px 12px;background:linear-gradient(transparent 45%,var(--chem) 45%);position:relative;top:2px}
.pill{border:3px solid var(--ink);border-radius:999px;padding:6px 14px;background:var(--card);font-weight:700;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.stars{background:var(--sun)}
.stars.pop{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.25) rotate(-6deg)}}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,44px)}
.lead{color:var(--muted);margin:6px 0 0;max-width:62ch}

.btn{border:3px solid var(--ink);border-radius:18px;background:var(--card);box-shadow:0 5px 0 var(--ink);padding:14px 20px;font-weight:700;font-size:20px;transition:transform .06s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.primary{background:var(--sun)}
.btn.good{background:var(--good);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}

/* picker */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:24px;margin-top:28px}
.who{text-align:left;padding:24px;display:flex;flex-direction:column;gap:10px;min-height:220px}
.who .name{font-family:var(--display);font-weight:800;font-size:44px;line-height:1}
.who .tag{font-size:14px;text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
.who .list{color:var(--muted)}
.who.fs2{background:#FFF4D6}.who.y5{background:var(--phys-soft)}

/* hub */
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:20px;margin-top:24px}
.subj{border:3px solid var(--ink);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.subj h2{font-size:30px;display:flex;align-items:center;gap:10px}
.subj h2 span{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink)}
.subj.math{background:var(--math-soft)}.subj.math h2 span{background:var(--math)}
.subj.phys{background:var(--phys-soft)}.subj.phys h2 span{background:var(--phys)}
.subj.chem{background:var(--chem-soft)}.subj.chem h2 span{background:var(--chem)}
.actbtn{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.actbtn b{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.1}
.actbtn small{color:var(--muted);font-size:15px;font-weight:400}

/* activity shell */
.act{margin-top:10px;display:flex;flex-direction:column;gap:18px}
.act-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;letter-spacing:1.6px;text-transform:uppercase;font-weight:700}
.math .eyebrow{color:var(--math)}.phys .eyebrow{color:var(--phys)}.chem .eyebrow{color:var(--chem)}
.panel{border:3px solid var(--ink);border-radius:22px;background:var(--card);padding:20px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--ink);border-radius:999px;padding:8px 16px;background:var(--card);font-weight:700;box-shadow:0 3px 0 var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.now{background:var(--sun)}
.fb{min-height:1.5em;font-weight:700;font-size:20px}
.fb.ok{color:var(--good)}.fb.no{color:var(--bad)}

/* sprint */
.split{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:760px){.split{grid-template-columns:1.2fr 1fr}}
.q{font-family:var(--display);font-weight:800;font-size:clamp(34px,6vw,58px);line-height:1.1;margin:12px 0}
.q.small{font-size:clamp(24px,3.6vw,34px)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;margin:0 4px;font-size:.8em}
.frac b{border-bottom:4px solid var(--ink);padding:0 6px 2px}
.frac em{font-style:normal;padding-top:2px}
.ansbox{border:3px dashed var(--ink);border-radius:16px;padding:10px 18px;font-family:var(--display);font-size:44px;font-weight:800;min-height:80px;font-variant-numeric:tabular-nums;background:var(--paper)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad .btn{font-size:30px;padding:14px 0;font-family:var(--display)}
.pad .wide{grid-column:1/-1}

/* mc */
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.opts .btn{text-align:left;font-size:20px}

/* canvas sims */
.stage{position:relative;width:100%;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff}
canvas{display:block;width:100%}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;align-items:end}
.lbl{font-size:14px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
input[type=range]{width:100%;height:44px;accent-color:var(--ink)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.ro{border:2px solid var(--ink);border-radius:14px;padding:8px 12px;background:var(--paper)}
.ro small{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);font-weight:700}
.ro b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
.tasks{display:flex;flex-wrap:wrap;gap:10px}
.task{border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-weight:700;background:var(--card)}
.task.done{background:var(--good);color:#fff}

/* sorter */
.card-big{border:3px solid var(--ink);border-radius:22px;background:var(--card);padding:28px;text-align:center;box-shadow:0 6px 0 var(--ink)}
.card-big .q{margin:4px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .btn{font-size:22px;padding:20px 10px}

/* FS2 */
.prompt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.speak{width:64px;height:64px;border-radius:50%;padding:0;display:grid;place-items:center;flex:none}
.speak svg{width:30px;height:30px}
.things{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px}
.thing{width:84px;height:84px;font-size:56px;line-height:1;border:none;background:none;position:relative;padding:0}
.thing .n{position:absolute;right:-4px;top:-4px;background:var(--sun);border:3px solid var(--ink);border-radius:50%;width:34px;height:34px;font:800 18px/28px var(--display)}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.nums .btn{font-family:var(--display);font-size:56px;padding:10px 0}
.shapes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.shapes .btn{padding:14px;aspect-ratio:1;max-width:100%}
.shapes svg{width:100%;height:100%}
.tank{position:relative;height:300px;border:4px solid var(--ink);border-top:none;border-radius:0 0 28px 28px;background:linear-gradient(transparent 38%,#9BD3F2 38%,#5AB0E3 100%);overflow:hidden;max-width:520px;margin:0 auto;width:100%}
.tank::before{content:"";position:absolute;left:0;right:0;top:38%;height:6px;background:repeating-linear-gradient(90deg,#fff8 0 18px,transparent 18px 36px)}
.obj{position:absolute;left:50%;top:6px;font-size:64px;line-height:1;transform:translateX(-50%);transition:top 1.3s cubic-bezier(.45,.05,.55,.95)}
.obj.bob{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateX(-50%) translateY(6px) rotate(4deg)}}
.pots{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.pot{width:96px;height:96px;border-radius:50%;border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:0}
.pot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bowl{width:min(220px,60vw);aspect-ratio:1;border-radius:50%;border:5px solid var(--ink);margin:0 auto;background:#fff;transition:background .8s;display:grid;place-items:center;position:relative}
.bowl.swirl{animation:spin .9s ease-out}
@keyframes spin{to{transform:rotate(360deg)}}
.blobs{display:flex;gap:10px;justify-content:center;min-height:40px}
.blobs i{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink)}
.done-card{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:24px}
.big-star{font-size:80px;line-height:1;color:var(--sun);-webkit-text-stroke:3px var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="bar">
    <button class="pill" id="back" hidden>‹ Back</button>
    <div class="brand"><i aria-hidden="true"></i>Little Lab</div>
    <div class="pill stars" id="stars" aria-label="Stars earned">★ <span id="starN">0</span></div>
    <button class="pill" id="who" hidden>Switch</button>
  </header>
  <main id="main"></main>
</div>

<script>
const $=s=>document.querySelector(s), main=$('#main');
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const S={profile:null,stars:{fs2:0,y5:0}};
const NAMES={fs2:'Zoe',y5:'Rayan'};
try{const d=JSON.parse(localStorage.getItem('littlelab')||'{}');Object.assign(S.stars,d.stars||{});}catch(e){}
function save(){try{localStorage.setItem('littlelab',JSON.stringify({stars:S.stars}))}catch(e){}}
function updStars(pop){$('#starN').textContent=S.profile?S.stars[S.profile]:0;if(pop){const s=$('#stars');s.classList.remove('pop');void s.offsetWidth;s.classList.add('pop')}}
function star(){if(!S.profile)return;S.stars[S.profile]++;save();updStars(true)}
let AC;function tone(ok){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[660,880,1175]:[260,200]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.1);g.gain.exponentialRampToValueAtTime(.18,t+i*.1+.02);g.gain.exponentialRampToValueAtTime(.0001,t+i*.1+.25);o.connect(g).connect(AC.destination);o.start(t+i*.1);o.stop(t+i*.1+.3)})}catch(e){}}
function say(txt){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=.88;u.pitch=1.15;s.speak(u)}catch(e){}}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';

/* ---------- navigation ---------- */
let stack=[],cleanup=null;
function go(fn,push=true){if(cleanup){cleanup();cleanup=null}try{speechSynthesis.cancel()}catch(e){}
  if(push)stack.push(fn);main.innerHTML='';fn();window.scrollTo(0,0);
  $('#back').hidden=stack.length<=1;$('#who').hidden=!S.profile;
  if(S.profile)$('#who').textContent=NAMES[S.profile]+' ⇄';updStars()}
$('#back').onclick=()=>{if(stack.length>1){stack.pop();go(stack[stack.length-1],false)}};
$('#who').onclick=()=>{stack=[];S.profile=null;go(home)};

const SUBJ={math:'Maths',phys:'Physics',chem:'Chemistry'};
const ACTS={
 y5:{math:[['Number Sprint','Times tables, division, fractions, decimals, rounding, area',()=>sprint()]],
     phys:[['Friction Track','Push a cart across ice, wood, carpet and sand. Park it in the zone.',()=>track()],['Forces Quiz','Gravity, air resistance, levers, pulleys and gears',()=>forcesQuiz()]],
     chem:[['Particle Lab','Heat and cool water. Watch the particles change state.',()=>particles()],['Change Sorter','Reversible or irreversible? Sort 12 real changes.',()=>sorter()]]},
 fs2:{math:[['Count With Me','Tap to count, then pick the number',()=>countGame()],['Shape Spotter','Listen and find the right shape',()=>shapeGame()]],
     phys:[['Sink or Float','Guess, then drop it in the water',()=>sinkFloat()]],
     chem:[['Colour Mixer','Mix two paints to make a new colour',()=>mixer()]]}
};

function home(){
  main.innerHTML=`<section style="margin-top:14px"><h1>Who's in the lab today?</h1>
  <p class="lead">Maths, physics and chemistry to play with. Earn a star for every right answer.</p>
  <div class="pick">
   <button class="btn who fs2" data-p="fs2"><span class="tag">FS2 · Little Explorers</span><span class="name">Zoe</span><span class="list">Counting · Shapes · Sink or float · Colour mixing</span><span class="list">★ ${S.stars.fs2} stars</span></button>
   <button class="btn who y5" data-p="y5"><span class="tag">Year 5 · Lab Scientists</span><span class="name">Rayan</span><span class="list">Number sprint · Friction · Forces · Particles · Changes</span><span class="list">★ ${S.stars.y5} stars</span></button>
  </div></section>`;
  main.querySelectorAll('.who').forEach(b=>b.onclick=()=>{S.profile=b.dataset.p;go(hub)});
}
function hub(){
  const p=S.profile,a=ACTS[p];
  main.innerHTML=`<section style="margin-top:14px"><h1>Hi ${NAMES[p]}! Pick an experiment.</h1>
  <p class="lead">${p==='fs2'?'Tap the speaker in any game to hear the question.':'Year 5 science and maths. Every right answer earns a star.'}</p>
  <div class="hub">${Object.keys(SUBJ).map(k=>`<div class="subj ${k}"><h2><span></span>${SUBJ[k]}</h2>
   ${a[k].map((x,i)=>`<button class="btn actbtn" data-k="${k}" data-i="${i}"><b>${x[0]}</b><small>${x[1]}</small></button>`).join('')}</div>`).join('')}</div></section>`;
  main.querySelectorAll('.actbtn').forEach(b=>b.onclick=()=>go(a[b.dataset.k][+b.dataset.i][2]));
}
function head(cls,sub,title,extra=''){return `<div class="act-head"><div><div class="eyebrow">${sub}</div><h1>${title}</h1></div>${extra}</div>`}
function doneCard(score,total,again){return `<div class="done-card"><div class="big-star">★</div><h2>${score} out of ${total}!</h2><p class="lead">${score===total?'Perfect round. Brilliant work!':score>=total/2?'Great job. Try again to beat your score.':'Good try! Have another go.'}</p><button class="btn primary" id="again">Play again</button></div>`}

/* ---------- Y5 MATHS: Number Sprint ---------- */
const fr=(n,d)=>`<span class="frac"><b>${n}</b><em>${d}</em></span>`;
const GEN={
 times:()=>{const a=R(2,12),b=R(2,12);return{t:`${a} × ${b}`,a:a*b}},
 divide:()=>{const a=R(2,12),b=R(2,12);return{t:`${a*b} ÷ ${a}`,a:b}},
 fractions:()=>{const d=[2,3,4,5,6,8,10][R(0,6)],n=R(1,d-1),k=R(2,9);return{t:`${fr(n,d)} of ${d*k}`,a:n*k}},
 decimals:()=>{const w=R(0,6),x=R(1,9),y=R(1,9);return Math.random()<.5?{t:`${w}.${x} + 0.${y}`,a:Math.round((w+x/10+y/10)*10)/10}:{t:`${w+1}.${x} − 0.${y}`,a:Math.round((w+1+x/10-y/10)*10)/10}},
 rounding:()=>{const n=R(1000,9999),p=[10,100,1000][R(0,2)];return{t:`Round ${n.toLocaleString('en-GB')} to the nearest ${p.toLocaleString('en-GB')}`,a:Math.round(n/p)*p,s:1}},
 area:()=>{const l=R(3,12),w=R(2,9);return{t:`Area of a ${l} cm × ${w} cm rectangle, in cm²`,a:l*w,s:1}}
};
function sprint(){
  const TOP=[['mixed','Mixed'],['times','×'],['divide','÷'],['fractions','Fractions'],['decimals','Decimals'],['rounding','Rounding'],['area','Area']];
  let topic='mixed',i,score,res,q,inp,lock;const N=10;
  main.innerHTML=`<section class="act math">${head('math','Maths · Year 5','Number Sprint')}
   <div class="chips" id="tp">${TOP.map(t=>`<button class="chip" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
   <div class="split"><div class="panel" id="qp"></div><div class="pad" id="pad">${'789456123'.split('').map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('')}<button class="btn" data-k=".">.</button><button class="btn" data-k="0">0</button><button class="btn" data-k="del" aria-label="Delete">⌫</button><button class="btn primary wide" data-k="ok">Check</button></div></div></section>`;
  const qp=$('#qp');
  function start(){i=0;score=0;res=[];next()}
  function next(){if(i>=N){qp.innerHTML=doneCard(score,N);$('#again').onclick=start;return}
    const key=topic==='mixed'?Object.keys(GEN)[R(0,5)]:topic;q=GEN[key]();inp='';lock=false;draw()}
  function draw(){qp.innerHTML=`<div class="dots">${Array.from({length:N},(_,k)=>`<i class="${res[k]===1?'ok':res[k]===0?'no':k===i?'now':''}"></i>`).join('')}</div>
    <div class="q ${q.s?'small':''}">${q.t} =</div><div class="ansbox" id="ans">${inp||'&nbsp;'}</div><div class="fb" id="fb"></div>`}
  function check(){if(lock||inp==='')return;lock=true;const ok=Math.abs(parseFloat(inp)-q.a)<1e-9,fb=$('#fb');
    res[i]=ok?1:0;if(ok){score++;star();fb.className='fb ok';fb.textContent='Correct!'}else{fb.className='fb no';fb.textContent=`Not quite. The answer is ${q.a}.`}
    tone(ok);setTimeout(()=>{i++;next()},ok?900:2000)}
  $('#pad').onclick=e=>{const b=e.target.closest('button');if(!b||lock||i>=N)return;const k=b.dataset.k;
    if(k==='ok')return check();if(k==='del')inp=inp.slice(0,-1);else if(inp.length<7&&!(k==='.'&&inp.includes('.')))inp+=k;$('#ans').innerHTML=inp||'&nbsp;'};
  const tp=$('#tp');function setT(t){topic=t;tp.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.t===t));start()}
  tp.onclick=e=>{const c=e.target.closest('.chip');if(c)setT(c.dataset.t)};
  const kb=e=>{if(/^[0-9.]$/.test(e.key)){if(!lock&&inp.length<7&&!(e.key==='.'&&inp.includes('.'))){inp+=e.key;$('#ans').innerHTML=inp}}else if(e.key==='Backspace'){inp=inp.slice(0,-1);$('#ans').innerHTML=inp||'&nbsp;'}else if(e.key==='Enter')check()};
  document.addEventListener('keydown',kb);cleanup=()=>document.removeEventListener('keydown',kb);
  setT('mixed');
}

/* ---------- multiple choice engine ---------- */
function mcQuiz(cls,sub,title,bank){
  let qs,i,score;
  main.innerHTML=`<section class="act ${cls}">${head(cls,sub,title)}<div class="panel" id="qp"></div></section>`;
  const qp=$('#qp');
  function start(){qs=shuffle(bank);i=0;score=0;show()}
  function show(){if(i>=qs.length){qp.innerHTML=doneCard(score,qs.length);$('#again').onclick=start;return}
    const q=qs[i],opts=shuffle(q.o.map((t,k)=>({t,ok:k===0})));
    qp.innerHTML=`<div class="dots">${qs.map((_,k)=>`<i class="${k<i?'ok':k===i?'now':''}"></i>`).join('')}</div><div class="q small">${q.q}</div>
     <div class="opts">${opts.map((o,k)=>`<button class="btn" data-k="${k}">${o.t}</button>`).join('')}</div><div class="fb" id="fb" style="margin-top:14px"></div>`;
    let lock=false;qp.querySelector('.opts').onclick=e=>{const b=e.target.closest('button');if(!b||lock)return;lock=true;const o=opts[+b.dataset.k],fb=$('#fb');
      b.classList.add(o.ok?'good':'bad');if(!o.ok)qp.querySelectorAll('.opts .btn')[opts.findIndex(x=>x.ok)].classList.add('good');

function track(){

  cv=$('#cv');

  function newZone(){zone=R(5,15)+(Math.random()<.5?.5:0);x=0;$('#fb').textContent='';$('#fb').className='fb';draw()}
  function draw(){if(!ctx)return;const m=28,sc=(W-2*m-14)/L,gy=H-70,s=SURF[surf];ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#F7FBFF';ctx.fillRect(0,0,W,gy);
    ctx.fillStyle='rgba(30,158,84,.16)';ctx.fillRect(m+zone*sc,gy-110,2*sc,110);ctx.setLineDash([6,5]);ctx.strokeStyle='#1E9E54';ctx.lineWidth=2;ctx.strokeRect(m+zone*sc,gy-110,2*sc,110);ctx.setLineDash([]);
    ctx.fillStyle='#1E9E54';ctx.font='700 13px "Atkinson Hyperlegible",sans-serif';ctx.textAlign='center';ctx.fillText('PARK HERE',m+(zone+1)*sc,gy-118+2<12?14:gy-118);
    ctx.fillStyle=s.c;ctx.fillRect(m,gy,L*sc,18);ctx.fillStyle=s.t;for(let k=0;k<L*sc;k+=10)ctx.fillRect(m+k,gy+(k/10%2?4:10),5,3);
    ctx.fillStyle='#1D2A44';ctx.fillRect(m+L*sc,gy-120,14,138);
    ctx.strokeStyle='#1D2A44';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(m,gy+18);ctx.lineTo(m+L*sc,gy+18);ctx.stroke();
    ctx.font='700 12px "Atkinson Hyperlegible",sans-serif';for(let k=0;k<=L;k++){const px=m+k*sc;ctx.beginPath();ctx.moveTo(px,gy+18);ctx.lineTo(px,gy+(k%2?25:30));ctx.stroke();if(k%2===0)ctx.fillText(k+' m',px,gy+46)}
    const cx=m+x*sc,cw=46,ch=26;ctx.fillStyle='#2F86D6';ctx.strokeStyle='#1D2A44';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect?ctx.roundRect(cx-cw/2,gy-ch-12,cw,ch,6):ctx.rect(cx-cw/2,gy-ch-12,cw,ch);ctx.fill();ctx.stroke();
    ctx.fillStyle='#FFC83D';[cx-13,cx+13].forEach(wx=>{ctx.beginPath();ctx.arc(wx,gy-7,7,0,7);ctx.fill();ctx.stroke()});
    ctx.fillStyle='#1D2A44';ctx.beginPath();ctx.moveTo(cx,gy-ch-12);ctx.lineTo(cx,gy-ch-30);ctx.stroke();ctx.fillStyle='#FFC83D';ctx.fillRect(cx,gy-ch-30,14,9);ctx.strokeRect(cx,gy-ch-30,14,9)}
  function launch(){if(running)return;running=true;x=0;v0=push*0.8;a=SURF[surf].mu*g;d=v0*v0/(2*a);crash=d>L-0.4;t0=performance.now();
    $('#r1').textContent=v0.toFixed(1)+' m/s';$('#r4').textContent=SURF[surf].n;$('#fb').textContent='';$('#go').disabled=true;
    const tStop=v0/a;const step=now=>{let t=(now-t0)/1000*2.2;if(t>tStop)t=tStop;x=v0*t-.5*a*t*t;let v=v0-a*t;
      if(crash&&x>=L-0.4){x=L-0.4;v=0;t=tStop}

      if(t<tStop)raf=requestAnimationFrame(step);else finish()};raf=requestAnimationFrame(step)}
  function finish(){running=false;$('#go').disabled=false;const fb=$('#fb'),inZ=x>=zone&&x<=zone+2;

/* ---------- Y5 CHEMISTRY: Particle Lab ---------- */
function particles(){
  let temp=20,raf,ctx,W,H=320,P=[],wasSolid=false;const r=10,N=36,tasks={freeze:false,melt:false,boil:false};
  main.innerHTML=`<section class="act chem">${head('chem','Chemistry · Year 5','Particle Lab')}
   <p class="lead" style="margin:0">Water is made of tiny particles. Change the temperature and watch how they move. Water freezes at 0 °C and boils at 100 °C.</p>
   <div class="tasks" id="tk"><span class="task" data-t="freeze">Freeze it</span><span class="task" data-t="melt">Melt it again</span><span class="task" data-t="boil">Boil it</span></div>
   <div class="split"><div class="stage"><canvas id="cv"></canvas></div>
    <div class="panel" style="display:flex;flex-direction:column;gap:16px"><div class="readouts"><div class="ro"><small>Temperature</small><b id="tv">20 °C</b></div><div class="ro"><small>State</small><b id="sv">Liquid</b></div></div>
    <div><label class="lbl" for="tr">Heat or cool</label><input id="tr" type="range" min="-30" max="140" value="20"></div>
    <p id="info" style="margin:0"></p></div></div></section>`;
  const cv=$('#cv');
  const INFO={Solid:'Ice. Particles are packed tightly in a pattern. They vibrate but stay in place, so a solid keeps its shape.',Liquid:'Water. Particles are close together but slide past each other, so a liquid flows and takes the shape of its container.',Gas:'Steam. Particles are far apart and zoom around in every direction, filling the whole container.'};
  const state=()=>temp<0?'Solid':temp<100?'Liquid':'Gas';
  function targets(){const cols=6,sp=2*r+1,ox=W/2-(cols-1)*sp/2;P.forEach((p,k)=>{p.tx=ox+(k%cols)*sp;p.ty=H-20-r-Math.floor(k/cols)*sp})}
  const resize=()=>{({x:ctx,w:W}=fitCanvas(cv,H));if(!P.length)for(let k=0;k<N;k++)P.push({x:R(20,W-20),y:R(H/2,H-20),vx:Math.random()*2-1,vy:0});targets()};
  function tick(){const s=state(),wl=14,wr=W-14,wb=H-14,wt=12;
    for(const p of P){if(s==='Solid'){const amp=.4+(temp+30)/18;p.x+=(p.tx-p.x)*.25+(Math.random()-.5)*amp;p.y+=(p.ty-p.y)*.25+(Math.random()-.5)*amp;p.vx=p.vy=0;continue}
      if(s==='Liquid'){p.vy+=.35;const k=.4+temp/60;p.vx+=(Math.random()-.5)*k;p.vy+=(Math.random()-.5)*k;p.vx*=.96;p.vy*=.96}
      else{const sp=Math.hypot(p.vx,p.vy)||1,tg=4+(temp-100)/12;p.vx*=1+(tg/sp-1)*.08;p.vy*=1+(tg/sp-1)*.08;if(sp<.5){p.vx=Math.random()*4-2;p.vy=-3}}
      p.x+=p.vx;p.y+=p.vy;
      if(p.x<wl+r){p.x=wl+r;p.vx=Math.abs(p.vx)}if(p.x>wr-r){p.x=wr-r;p.vx=-Math.abs(p.vx)}
      if(p.y>wb-r){p.y=wb-r;p.vy=-Math.abs(p.vy)*(s==='Gas'?1:.3)}if(p.y<wt+r){p.y=wt+r;p.vy=Math.abs(p.vy)}}
    if(s!=='Solid')for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);if(d>0&&d<2*r){const o=(2*r-d)/2,nx=dx/d,ny=dy/d;a.x-=nx*o;a.y-=ny*o;b.x+=nx*o;b.y+=ny*o;if(s==='Gas'){const t=a.vx;a.vx=b.vx;b.vx=t;const u=a.vy;a.vy=b.vy;b.vy=u}}}
    ctx.clearRect(0,0,W,H);ctx.fillStyle=s==='Gas'?'#FFF6EE':'#F5FAFF';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='#1D2A44';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(wl-2,8);ctx.lineTo(wl-2,wb+2);ctx.lineTo(wr+2,wb+2);ctx.lineTo(wr+2,8);ctx.stroke();
    for(const p of P){ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.fillStyle=s==='Solid'?'#9FD4F5':s==='Liquid'?'#2F86D6':'#F07F5A';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#1D2A44';ctx.stroke();ctx.beginPath();ctx.arc(p.x-3,p.y-3,2.6,0,7);ctx.fillStyle='#ffffffcc';ctx.fill()}
    raf=requestAnimationFrame(tick)}
  function setT(v){temp=v;const s=state();$('#tv').textContent=v+' °C';$('#sv').textContent=s==='Solid'?'Solid (ice)':s==='Liquid'?'Liquid':'Gas (steam)';$('#info').textContent=INFO[s];
    const done=k=>{if(!tasks[k]){tasks[k]=true;star();tone(true);$(`[data-t=${k}]`).classList.add('done')}};
    if(s==='Solid'){wasSolid=true;done('freeze')}if(s==='Liquid'&&wasSolid)done('melt');if(s==='Gas')done('boil')}
  $('#tr').oninput=e=>setT(+e.target.value);
  window.addEventListener('resize',resize);cleanup=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',resize)};
  resize();setT(20);raf=requestAnimationFrame(tick);
}

/* ---------- FS2: Colour Mixer ---------- */
function mixer(){
  const P={red:'#E23B3B',yellow:'#FFD23F',blue:'#2F6FD6',white:'#FFFFFF'};
  const MIX={'red+yellow':['orange','#FF8A1F'],'blue+yellow':['green','#2FA24A'],'blue+red':['purple','#8247C2'],'red+white':['pink','#F79AB4'],'blue+white':['light blue','#9CC8F5'],'white+yellow':['cream','#FFF0B3']};
  const TG=['orange','green','purple','pink','light blue'];
  let pick=[],target;
  main.innerHTML=`<section class="act chem">${head('chem','Chemistry · FS2','Colour Mixer')}
   <div class="panel" style="display:flex;flex-direction:column;gap:18px">
    <div class="prompt"><button class="btn speak" id="sp" aria-label="Hear the question">${SPK}</button><h2 style="font-size:32px" id="tq"></h2></div>
    <div class="pots" id="pots">${Object.keys(P).map(k=>`<button class="pot" data-c="${k}" style="background:${P[k]}" aria-label="${k} paint"></button>`).join('')}</div>
    <div class="blobs" id="bl"></div><div class="bowl" id="bw"></div>
    <div class="fb" id="fb" style="text-align:center"></div>
    <div style="text-align:center"><button class="btn" id="rs">Empty the bowl</button></div></div></section>`;
  function newT(){target=TG[R(0,TG.length-1)];$('#tq').textContent=`Can you make ${target}?`;say(`Can you make ${target}? Pick two paints.`)}
  function reset(){pick=[];$('#bl').innerHTML='';$('#bw').style.background='#fff';$('#fb').textContent=''}
  $('#pots').onclick=e=>{const b=e.target.closest('.pot');if(!b||pick.length>=2)return;pick.push(b.dataset.c);say(b.dataset.c);
    $('#bl').insertAdjacentHTML('beforeend',`<i style="background:${P[b.dataset.c]}"></i>`);
    if(pick.length===2){const key=[...pick].sort().join('+'),res=pick[0]===pick[1]?[pick[0],P[pick[0]]]:MIX[key],bw=$('#bw');
      bw.classList.remove('swirl');void bw.offsetWidth;bw.classList.add('swirl');bw.style.background=res[1];
      setTimeout(()=>{const ok=res[0]===target,fb=$('#fb'),msg=`${pick[0]} and ${pick[1]} make ${res[0]}!`;fb.className='fb '+(ok?'ok':'');fb.textContent=msg+(ok?' You did it!':'');tone(ok);
        if(ok){star();say(msg+' You did it!');setTimeout(()=>{reset();newT()},2600)}else say(msg+` Now try to make ${target}.`)},900)}};
  $('#rs').onclick=reset;$('#sp').onclick=()=>say(`Can you make ${target}? Pick two paints.`);
  reset();newT();
}

go(home);
</script>
